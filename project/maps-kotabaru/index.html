        <span class="kp-meta"><span>${c.count} tempat</span><span>${fmtNum(c.hmin)}–${fmtNum(c.hmax)} m dpl</span><span>${String(c.area).replace('.', ',')} km²</span></span>
        <span class="kp-cta">Jelajahi di peta ${icon('arrow')}</span></span>
    </button>`;
  /* posisikan tepat di atas tombolnya (tetap di dalam layar); panah kecil menunjuk ke tombol */
  const ar = anchor ? anchor.getBoundingClientRect() : null, ax = ar ? ar.left + ar.width/2 : innerWidth/2;
  const px = isMobile ? 8 + (innerWidth - 16)/2 : clamp(ax, 176, innerWidth - 176);
  if (!isMobile) kecpop.style.setProperty('--px', px + 'px');
  kecpop.style.setProperty('--nx', clamp(ax - (isMobile ? 8 : px - 160), 22, (isMobile ? innerWidth - 16 : 320) - 22) + 'px');
  kecpop.hidden = false;
  kecpop.classList.remove('swap'); void kecpop.offsetWidth; kecpop.classList.add('swap');
  syncKecBar(); updateHighlight();
}
function closeKecPop(){
  if (popK === null) return;
  popK = null; kecpop.hidden = true; kecpop.innerHTML = '';
  syncKecBar(); updateHighlight();
}
kecpop.addEventListener('click', e => {
  if (e.target.closest('[data-x]')) closeKecPop();
  else if (e.target.closest('[data-go]')) exploreKec(popK, kecpop.querySelector('.kp-hero'));
});
/* transisi masuk: foto kartu pratinjau membesar memenuhi layar dengan judul kecamatan,
   lalu larut memperlihatkan peta yang sudah terbang ke kecamatan itu */
const T_REVEAL = 1250, T_INFO = 2100;
function enterTransition(k, fromEl){
  if (reduceMotion || !fromEl) return 0;
  const r = fromEl.getBoundingClientRect(), c = KEC[k], ph = kecPhoto(k);
  const el = document.createElement('div');
  el.className = 'kt'; el.style.setProperty('--c', c.color);
  el.innerHTML = `${ph ? `<img src="${esc(ph.src)}" alt="" referrerpolicy="no-referrer">` : motif(k)}
    <div class="kt-txt"><h2>${esc(c.name)}</h2><i class="kt-line"></i><p>${esc(c.char)}</p></div>`;
  Object.assign(el.style, {left:r.left + 'px', top:r.top + 'px', width:r.width + 'px', height:r.height + 'px'});
  $('#app').appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('full')));
  setTimeout(() => el.classList.add('out'), T_REVEAL);
  setTimeout(() => el.remove(), T_REVEAL + 800);
  return T_REVEAL;
}
/* penanda muncul bergiliran: yang ke-i mulai base + i*step detik */
function popInMarkers(list, base, step){
  clearTimeout(popinT);
  if (reduceMotion || !list.length) return;
  list.forEach((d, i) => {
    const el = MK[d.id];
    el.style.setProperty('--dl', (base + i*step).toFixed(3) + 's');
    el.classList.remove('popin'); void el.offsetWidth; el.classList.add('popin');
  });
  popinT = setTimeout(() => list.forEach(d => MK[d.id].classList.remove('popin')), (base + list.length*step)*1000 + 800);
}
/* explore: bar turun, kamera menukik ke kecamatan, wilayah berpendar, titik muncul bergantian, lalu kartu besar */
function exploreKec(k, fromEl){
  const reveal = enterTransition(k, fromEl);
  closeKecPop();
  if (state.sel) closeDetail();
  openCat = null; state.cats.clear();
  state.kec = k;
  if (state.tab !== 'jelajah') setTab('jelajah'); else renderJelajah();
  document.body.classList.add('exploring');
  if (isMobile) setSheet(false);
  updateMarkers(); updateHighlight(); syncKecBar();
  if (reveal) {
    /* kamera naik dulu lalu menukik sambil berputar, tersembunyi di balik transisi */
    const kb = KB[k];
    cineUntil = performance.now() + T_INFO + 600;
    setGoal({t:{x:(kb.minX + kb.maxX)/2, y:2, z:(kb.minZ + kb.maxZ)/2}, r:Math.max(ctl.g.r, 60)*1.15, ph:0.45, th:ctl.g.th - 0.35});
    setTimeout(() => { flyKec(k, {th:ctl.g.th + 0.5, ph:0.84}); ctl.g.r = clamp(ctl.g.r*1.25, LIM.rMin, LIM.rMax); }, 650);
    setTimeout(() => { if (has3D) { uni.uPulse.value = 1; needs = true; } }, reveal);
  } else flyKec(k);
  popInMarkers(kecPlaces(k).sort((a, b) => a.lat - b.lat), reveal ? reveal/1000 + 0.15 : 0.35, 0.08);
  clearTimeout(infoT); infoT = setTimeout(() => openKecInfo(k), reduceMotion ? 0 : reveal ? T_INFO : 1400);
}
function openKecInfo(k){
  infoK = k;
  const c = KEC[k], ph = kecPhoto(k), list = kecPlaces(k);
  kecinfo.style.setProperty('--c', c.color);
  /* maksimal 6 tempat (pilihan tur lebih dulu) supaya kartu muat tanpa scroll; sisanya ada di peta */
  const shown = list.slice().sort((a, b) => TOUR_PICK.includes(b.id) - TOUR_PICK.includes(a.id)).slice(0, 6), more = list.length - shown.length;
  kecinfo.innerHTML = `<div class="ki-hero">${ph ? `<img src="${esc(ph.src)}" alt="" referrerpolicy="no-referrer">` : motif(k)}
      <div class="ki-name"><h2 id="ki-title">${esc(c.name)}</h2></div>
      ${ph ? `<a class="ki-credit" href="${esc(ph.page)}" target="_blank" rel="noopener">Foto: ${esc(ph.credit || 'Wikimedia Commons')}</a>` : ''}
      <button class="ki-x" data-x aria-label="Tutup penjelasan ${esc(c.name)}">${icon('x')}</button></div>
    <div class="ki-body">
      <p class="ki-lead">${esc(c.char)}</p>
      <p class="ki-story">${esc(c.story || '')}</p>
      <dl class="kstats"><div><dt>Destinasi</dt><dd>${c.count}</dd></div><div><dt>Ketinggian</dt><dd>${fmtNum(c.hmin)}–${fmtNum(c.hmax)} m</dd></div><div><dt>Luas</dt><dd>${String(c.area).replace('.', ',')} km²</dd></div></dl>
      ${c.cocok && c.cocok.length ? `<p class="ki-fit"><b>Cocok untuk</b>${c.cocok.map(esc).join(' · ')}</p>` : ''}
      <div class="ki-sechead"><h3 class="sec">${list.length} tempat di ${esc(c.name)}</h3>${more ? `<button class="linkbtn" data-map>+${more} lainnya di peta</button>` : ''}</div>
      <ul class="ki-places">${shown.map(d => `<li><button class="ki-pl" data-id="${d.id}" title="${esc(d.name)}"><span class="ki-pl-i">${icon(CAT[d.cat].icon)}</span><span>${esc(d.name)}</span></button></li>`).join('')}</ul>
      <div class="ki-acts"><button class="btn btn-primary" data-map>Lihat di peta</button><button class="btn btn-ghost" data-other>Kecamatan lain</button></div>
    </div>`;
  kecinfo.hidden = false; kecinfo.scrollTop = 0;
  updateViewOffset(); startOrbit();
  kecinfo.querySelector('.ki-x').focus({preventScroll:true});
}
function closeKecInfo(){
  clearTimeout(infoT);
  document.body.classList.remove('exploring');
  if (infoK !== null) { infoK = null; kecinfo.hidden = true; kecinfo.innerHTML = ''; }
  updateViewOffset();
}
kecinfo.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.hasAttribute('data-x') || b.hasAttribute('data-map')) closeKecInfo();
  else if (b.hasAttribute('data-other')) {
    const k = infoK; closeKecInfo();
    kecbar.classList.remove('nudge'); void kecbar.offsetWidth; kecbar.classList.add('nudge');
    const n = kblist.querySelector(`[data-k="${(k + 1) % KEC.length}"]`); if (n) n.focus({preventScroll:true});
  }
  else if (b.dataset.id) { closeKecInfo(); selectPlace(b.dataset.id); }
});

/* ============== layar sambutan: play → salam narator → pandu virtual tour atau explore sendiri ============== */
const welcome = $('#welcome'), wlVideo = welcome.querySelector('.wl-bg');
welcome.querySelector('.wl-n').textContent = `${KEC.length} kecamatan · ${DEST.length} tempat`;
/* Video latar (bila ada) selalu tanpa suara. Tanpa video, atau bila pengunjung memilih "kurangi
   gerakan" atau hemat data, cukup poster panorama (tanpa video ia bergerak pelan); selain itu video
   muncul perlahan begitu mulai diputar, dengan poster sebagai cadangan bila video gagal dimuat. */
const showWlBg = () => wlVideo.classList.add('ready');
wlVideo.muted = true;
if (!wlVideo.getAttribute('src')) { showWlBg(); wlVideo.classList.add('still'); }
else if (reduceMotion || (navigator.connection && navigator.connection.saveData)) showWlBg();
else {
  wlVideo.addEventListener('playing', showWlBg, {once:true});
  wlVideo.addEventListener('error', showWlBg, {once:true});
  const p = wlVideo.play(); if (p && p.catch) p.catch(showWlBg);
  setTimeout(showWlBg, 3000);
}
let wlT = 0;
function closeWelcome(){
  if (welcome.hidden) return;
  clearTimeout(wlT);
  if (NARATOR.current() === 'welcome') NARATOR.stop();
  welcome.classList.add('out');
  setTimeout(() => { welcome.hidden = true; welcome.classList.remove('out'); wlVideo.pause(); }, reduceMotion ? 0 : 600);
}
function chooseExplore(){
  closeWelcome(); MUSIK.mode('explore');
  kecbar.classList.remove('nudge'); void kecbar.offsetWidth; kecbar.classList.add('nudge');
  toast('Pilih kecamatan di bar bawah untuk mulai menjelajah');
}
/* Keluaran audio yang lama diam (terutama headset Bluetooth) baru aktif sepersekian detik
   setelah suara pertama, sehingga awal kalimat bisa terpotong. Hening sebentar lewat Web Audio
   membangunkannya lebih dulu. */
function wakeAudio(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    const c = new AC(), s = c.createBufferSource();
    s.buffer = c.createBuffer(1, Math.round(c.sampleRate*1.5), c.sampleRate);
    s.connect(c.destination); s.onended = () => c.close(); s.start();
  } catch (e) {}
}
/* tombol play adalah izin suara dari pengunjung: nyalakan narator bila sebelumnya dimatikan.
   Musik latar langsung masuk perlahan; salam menyusul setelah jeda singkat (saat pilihan
   muncul) dengan fade in, lalu musik berlanjut tanpa putus ke tour atau explore. */
$('#wl-play').addEventListener('click', e => {
  if (NARATOR.isMuted()) NARATOR.setMuted(false);
  wakeAudio(); MUSIK.mode('welcome');
  welcome.classList.add('go');
  clearTimeout(wlT);
  wlT = setTimeout(() => { if (!welcome.hidden) NARATOR.play('welcome', null, {fade:0.2}); }, reduceMotion ? 300 : 900);
  if (e.detail === 0) welcome.querySelector('.wl-opt').focus({preventScroll:true});   /* hanya bila lewat keyboard */
});
welcome.addEventListener('click', e => {
  const b = e.target.closest('[data-wl]');
  if (b) { if (b.dataset.wl === 'tour') { closeWelcome(); startTour(); } else chooseExplore(); }
});

/* ============== tab & search ============== */
const TABS = ['jelajah','koleksi','rencana'];
function setTab(t){
  state.tab = t;
  TABS.forEach(x => {
    const on = x === t; const tb = $('#t-' + x);
    tb.setAttribute('aria-selected', on); tb.tabIndex = on ? 0 : -1;
    $('#p-' + x).hidden = !on;
  });
  if (t === 'jelajah') renderJelajah();
  if (t === 'koleksi') renderKoleksi();
  if (t === 'rencana') renderRencana();
  updateMarkers(); updateHighlight(); updateRoute();
  if (t === 'rencana' && state.plan.length > 1) flyBounds(boundsOf(state.plan.map(p => BY[p.id])));
}
TABS.forEach((t, i) => {
  const b = $('#t-' + t);
  b.addEventListener('click', () => { setTab(t); if (isMobile) setSheet(true); });
  b.addEventListener('keydown', e => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const n = TABS[(i + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length];
    setTab(n); $('#t-' + n).focus();
  });
});
const qIn = $('#q');
qIn.addEventListener('input', () => {
  state.q = qIn.value.trim(); $('#qclear').hidden = !state.q;
  if (state.tab !== 'jelajah') setTab('jelajah'); else { renderJelajah(); updateMarkers(); }
});
qIn.addEventListener('focus', () => { if (isMobile) setSheet(true); });
qIn.addEventListener('keydown', e => { if (e.key === 'Enter') { const f = DEST.find(matches); if (f) { selectPlace(f.id); qIn.blur(); } } });
$('#qclear').addEventListener('click', () => { qIn.value = ''; state.q = ''; $('#qclear').hidden = true; renderJelajah(); updateMarkers(); qIn.focus(); });

/* ============== bottom sheet (mobile) ============== */
const panel = $('#panel'), handle = $('#handle');
function setSheet(open){
  panel.classList.toggle('expanded', open);
  handle.setAttribute('aria-expanded', open);
  handle.setAttribute('aria-label', open ? 'Perkecil panel' : 'Perbesar panel');
  setTimeout(updateViewOffset, 320);
}
let hy = null;
handle.addEventListener('pointerdown', e => { hy = e.clientY; handle.setPointerCapture(e.pointerId); });
handle.addEventListener('pointerup', e => {
  if (hy === null) return; const dy = e.clientY - hy; hy = null;
  if (dy < -18) setSheet(true); else if (dy > 18) setSheet(false); else setSheet(!panel.classList.contains('expanded'));
});

/* ============== kontrol peta ============== */
$('#zin').addEventListener('click', () => { stopOrbit(); zoomBy(0.7); });
$('#zout').addEventListener('click', () => { stopOrbit(); zoomBy(1.42); });
$('#home').addEventListener('click', () => { stopOrbit(); stopTour(); closeKecPop(); closeKecInfo(); if (state.kec !== null) selectKec(null); else flyHome(); });
$('#compass').addEventListener('click', () => { stopOrbit(); setGoal({th:0}); });
const musikBtn = $('#musik');
function syncMusik(){
  const on = MUSIK.isOn();
  musikBtn.hidden = !MUSIK.isAvailable();
  musikBtn.innerHTML = icon(on ? 'music' : 'musicoff');
  musikBtn.setAttribute('aria-pressed', on);
  musikBtn.title = on ? 'Matikan musik latar' : 'Nyalakan musik latar';
  musikBtn.classList.toggle('off', !on);
}
musikBtn.addEventListener('click', () => { MUSIK.setOn(!MUSIK.isOn()); toast(MUSIK.isOn() ? 'Musik latar dinyalakan' : 'Musik latar dimatikan'); });
MUSIK.onChange(syncMusik); syncMusik();
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!welcome.hidden) chooseExplore();
  else if (tour) stopTour();
  else if (infoK !== null) closeKecInfo();
  else if (popK !== null) closeKecPop();
  else if (state.sel) closeDetail();
});

let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }

/* ============== start ============== */
function resize(){
  isMobile = mqMobile.matches;
  if (has3D) { renderer.setSize(innerWidth, innerHeight, false); updateViewOffset(); }
}
renderJelajah(); updateBadge();
if (has3D) {
  buildScene();
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('wheel', e => { e.preventDefault(); tourPause(true); stopOrbit(); zoomBy(Math.exp(e.deltaY*0.0012)); }, {passive:false});
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  resize();
  setGoal(homeView(), true);
  if (!reduceMotion) { ctl.r *= 1.25; ctl.th -= 0.35; }
  updateMarkers(); updateRoute();
  canvas.classList.add('ready');
  requestAnimationFrame(frame);
  if (reduceMotion) fadeInExtras();
} else { resize(); }
addEventListener('resize', resize);
mqMobile.addEventListener && mqMobile.addEventListener('change', () => { resize(); if (has3D) flyHome(); });
})();
</script>
</body>
