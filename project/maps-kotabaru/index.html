<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F0F0F2">
<title>Terra Explorer: Kotabaru</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9B%B0%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@500;600&family=Allura&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Terra Explorer: Kotabaru
   Palet "Deep Luxurious Interior", tema terang: #F0F0F2 dominan (latar,
   peta, panel kaca putih), #0D0D0D teks, #364959 biru slate untuk aksen
   dan tombol utama, #BFBFBF / #8C8C8B untuk garis dan elemen sekunder.
   Area foto (layar sambutan, sampul kartu) tetap gelap.
   ========================================================= */
*{box-sizing:border-box}
:root{
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --bg:#F0F0F2;
  --panel:rgba(255,255,255,.80);
  --panel-solid:#FAFAFB;
  --line:rgba(13,13,13,.08);
  --line2:rgba(13,13,13,.15);
  --text:#0D0D0D;
  --muted:#4A5560;         /* abu-slate, ± 7:1 di atas panel */
  --faint:#6B7075;         /* ≥ 4,5:1 di atas panel */
  --accent:#364959;        /* biru slate: tombol utama */
  --accent-ink:#F0F0F2;
  --gold:#364959;          /* aksen (nama variabel dipertahankan dari versi Badung) */
  --sheet-h:212px;
  --pf-h:76px;             /* tinggi bar kecamatan di bawah */
  color-scheme:light;
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* permukaan bawaan browser ikut palet */
:root{accent-color:var(--gold)}
::selection{background:rgba(54,73,89,.22);color:#0D0D0D}
input{caret-color:var(--gold)}
h1,h2,h3{text-wrap:balance}
p{text-wrap:pretty}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;fill:currentColor;flex:none}

#app{position:fixed;inset:0;background:radial-gradient(120% 90% at 62% 30%,#FFFFFF 0%,#F0F0F2 55%,#E3E4E7 100%)}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;opacity:0;transition:opacity .6s}
#scene.ready{opacity:1}
#overlay,#markers{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fallback{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
.fallback[hidden]{display:none}

/* panel mengambang di atas peta 3D yang bergerak: blur menjaga teks terbaca di atas relief,
   tepi didefinisikan garis tipis saja (bayangan lebar tak terlihat di latar gelap) */
.glass{background:var(--panel);-webkit-backdrop-filter:blur(18px) saturate(125%);backdrop-filter:blur(18px) saturate(125%);border:1px solid var(--line);box-shadow:0 14px 34px -16px rgba(13,13,13,.28),0 1px 2px rgba(13,13,13,.06)}

/* ---------- panel ---------- */
#panel{position:absolute;z-index:5;top:calc(16px + env(safe-area-inset-top));left:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:364px;border-radius:22px;display:flex;flex-direction:column;overflow:hidden}
.handle{display:none}
.p-head{padding:20px 20px 14px}
.brand{display:flex;align-items:baseline;gap:9px;margin:0;font-size:inherit;font-weight:inherit}
.brand b{font-size:20px;font-weight:800;letter-spacing:-.025em}
.brand span{color:var(--muted);font-weight:500;font-size:14px}
.search{position:relative;margin-top:14px}
.search input{width:100%;height:42px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.9);padding:0 36px 0 40px;outline:none;transition:border-color .15s}
.search input::placeholder{color:var(--faint)}
.search input:focus{border-color:rgba(54,73,89,.7)}
.search>svg{position:absolute;left:13px;top:12px;color:var(--muted)}
.search .clear{position:absolute;right:6px;top:6px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.search .clear[hidden]{display:none}
.tabs{display:flex;padding:0 12px;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:12px 2px 11px;color:var(--muted);font-weight:600;font-size:13.5px;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;justify-content:center;align-items:center;gap:6px;transition:color .15s}
.tab:hover{color:var(--text)}
.tab[aria-selected=true]{color:var(--text);border-color:var(--accent)}
.tab .badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;display:inline-grid;place-items:center}
.tab .badge[hidden]{display:none}
.pane{flex:1;overflow:auto;padding:18px 20px 28px;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(13,13,13,.18) transparent}
.pane[hidden]{display:none}
.sec{font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 9px}
.sec+.chips{margin-bottom:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:rgba(13,13,13,.34)}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip svg.i{width:15px;height:15px}
.chip[aria-pressed=true]{background:var(--text);border-color:var(--text);color:#F0F0F2}

.kstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 0;padding:0}
.kstats div{margin:0}
.kstats dt{font-size:12px;color:var(--faint)}
.kstats dd{margin:1px 0 0;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}

.rhead{display:flex;justify-content:space-between;align-items:baseline;margin:4px 0 6px}
.rhead .sec{margin:0}
.linkbtn{color:var(--gold);font-weight:600;font-size:12.5px}
.linkbtn:hover{text-decoration:underline}
.plist{list-style:none;margin:0 -8px;padding:0}
.pitem{display:flex;align-items:center;gap:12px;width:100%;padding:8px;border-radius:12px;text-align:left;transition:background .12s}
.pitem:hover{background:rgba(13,13,13,.05)}
.pitem[aria-current=true]{background:rgba(13,13,13,.10)}
.pic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 30%,#FFFFFF);box-shadow:inset 0 0 0 1.5px var(--c);color:#0D0D0D}
.pic svg.i{width:16px;height:16px}
.ptext{min-width:0;flex:1}
.pname{display:block;font-weight:600;font-size:14px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmeta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-top:1px}
.pmeta svg.i{width:13px;height:13px;color:var(--gold)}
.empty{color:var(--muted);font-size:13.5px;padding:10px 0}
.note{margin:22px 0 0;font-size:12px;line-height:1.5;color:var(--faint)}

/* koleksi */
.colls{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.coll{width:100%;text-align:left;padding:14px 14px 13px;border-radius:14px;border:1px solid var(--line);background:rgba(13,13,13,.03);transition:border-color .15s,background .15s}
.coll:hover{border-color:var(--line2)}
.coll[aria-expanded=true]{background:rgba(13,13,13,.07);border-color:rgba(54,73,89,.45)}
.coll h3{margin:0;font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.coll p{margin:3px 0 10px;color:var(--muted);font-size:13px}
.kbar{display:flex;height:4px;border-radius:2px;overflow:hidden;gap:2px}
.kbar i{flex:1;background:var(--c)}
.coll-meta{margin-top:8px;font-size:12px;color:var(--faint)}
.coll-list{margin:6px -8px 4px}

/* rencana */
.plan-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.plan-top h2{margin:0;font-size:17px;font-weight:700}
.start{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.start input{height:34px;border-radius:10px;border:1px solid var(--line2);background:rgba(255,255,255,.9);padding:0 8px;color-scheme:light}
.plan{list-style:none;margin:0;padding:0}
.stop{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:10px 0}
.snum{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--accent);color:var(--accent-ink)}
.sname{font-weight:600;line-height:1.3;text-align:left}
.sname:hover{text-decoration:underline}
.stime{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.stime select{height:26px;border-radius:7px;border:1px solid var(--line2);background:rgba(255,255,255,.9);font-size:12px;padding:0 4px;color-scheme:light}
.sctl{display:flex;gap:2px}
.ibtn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.ibtn:hover{background:rgba(13,13,13,.07);color:var(--text)}
.ibtn:disabled{opacity:.3;cursor:default;background:none}
.ibtn svg.i{width:16px;height:16px}
.leg{padding:0 0 0 13px;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.leg span{display:block;border-left:2px dotted rgba(54,73,89,.45);padding:4px 0 4px 22px}
.summary{margin:14px 0 0;padding:12px 14px;border-radius:12px;background:rgba(13,13,13,.05);font-size:13px}
.summary strong{font-weight:700}
.hint{margin:10px 0 0;padding:10px 12px;border-radius:12px;border:1px solid rgba(54,73,89,.35);font-size:12.5px;color:var(--text);display:flex;gap:10px;align-items:flex-start}
.hint svg.i{color:var(--gold);width:16px;height:16px;margin-top:1px}
.hint button{color:var(--gold);font-weight:600;margin-top:4px;display:block}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{height:40px;padding:0 16px;border-radius:12px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s,background .15s}
.btn svg.i{width:16px;height:16px}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{border:1px solid var(--line2)}
.btn-ghost:hover{background:rgba(13,13,13,.06)}
.btn-done{background:rgba(54,73,89,.16);color:var(--gold);border:1px solid rgba(54,73,89,.45)}

/* jelajah: kategori */
.tab svg.star{width:15px;height:15px;color:var(--gold)}
.kfilter{display:flex;align-items:center;gap:8px;margin:0 0 14px;padding:8px 8px 8px 12px;border-radius:12px;background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);font-size:13px}
.kfilter i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.kfilter b{flex:1;font-weight:700}
.kfilter button{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.kfilter button:hover{background:rgba(13,13,13,.08);color:var(--text)}
.kfilter svg.i{width:15px;height:15px}
/* kotak kategori menempel di atas panel, jadi keempat kategori tetap terlihat saat daftar tempat di-scroll */
.cathead{--px:20px;--pt:18px;position:sticky;top:calc(-1*var(--pt));z-index:2;margin:calc(-1*var(--pt)) calc(-1*var(--px)) 0;padding:var(--pt) var(--px) 14px;background:linear-gradient(180deg,var(--panel-solid) calc(100% - 14px),transparent)}
.cats{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat{width:100%;height:100%;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;column-gap:9px;padding:12px 10px;border-radius:14px;border:1px solid var(--line);background:rgba(13,13,13,.03);text-align:left;transition:background .15s,border-color .15s,opacity .15s,padding .2s}
.cat:hover:not(:disabled){border-color:var(--line2);background:rgba(13,13,13,.06)}
.cat[aria-pressed=true]{border-color:rgba(54,73,89,.6);background:rgba(54,73,89,.13)}
.cat:disabled{opacity:.4;cursor:default}
.cat .ci{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:rgba(54,73,89,.08);color:var(--gold);transition:background .15s,color .15s}
.cat[aria-pressed=true] .ci{background:var(--gold);color:#F0F0F2}
.cat .ci svg.i{width:17px;height:17px}
.cat b{display:block;font-size:13px;line-height:1.25;font-weight:700}
.cat small{display:block;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cat em{grid-column:1/-1;margin-top:9px;font-style:normal;font-size:12px;line-height:1.4;color:var(--faint)}
.cathead.picked .cat{padding:9px 8px}
.cathead.picked .cat em{display:none}
.cat-hint{margin:2px 0 0;font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.cat-hint svg.i{width:15px;height:15px;color:var(--gold);flex:none}
/* rencana: rekomendasi */
.rek{list-style:none;margin:6px -8px 0;padding:0}
.rek li{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px}
.rek li:hover{background:rgba(13,13,13,.04)}
.rek .rn{width:22px;font-size:12px;font-weight:800;color:var(--faint);text-align:center;flex:none;font-variant-numeric:tabular-nums}
.rek .rt{flex:1;min-width:0;text-align:left}
.rek .rt b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rek .rt small{display:block;font-size:12px;color:var(--muted)}
.rek .radd{height:30px;padding:0 10px;border-radius:9px;border:1px solid var(--line2);display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;flex:none}
.rek .radd:hover{background:rgba(13,13,13,.07)}
.rek .radd svg.i{width:14px;height:14px}
.rek .radd.on{border-color:rgba(54,73,89,.5);color:var(--gold);background:rgba(54,73,89,.1)}

/* ---------- markers & labels ---------- */
.mk{position:absolute;left:0;top:0;pointer-events:auto;will-change:transform}
.mk[hidden]{display:none}
.mk-b{position:absolute;left:-15px;top:-15px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#0D0D0D;box-shadow:0 0 0 2px #FFFFFF,0 4px 12px rgba(13,13,13,.28);transition:transform .18s,opacity .2s,background .18s,color .18s}
.mk-b svg.i{width:15px;height:15px}
.mk:hover .mk-b{transform:scale(1.12)}
.mk.dim .mk-b{opacity:.32}
.mk.sel .mk-b{background:var(--c);color:#0D0D0D;transform:scale(1.28);box-shadow:0 0 0 3px #FFFFFF,0 0 0 5px #364959,0 6px 18px rgba(13,13,13,.3)}
.mk.inplan .mk-b{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 2px #FFFFFF,0 4px 12px rgba(13,13,13,.28)}
.mk-n{font-weight:800;font-size:13px;display:none}
.mk.inplan .mk-n{display:block}
.mk.inplan .mk-b svg{display:none}
.mk-l{position:absolute;left:0;bottom:22px;transform:translateX(-50%);white-space:nowrap;padding:4px 9px;border-radius:8px;background:rgba(255,255,255,.92);border:1px solid var(--line);font-size:12px;font-weight:600;box-shadow:0 4px 12px -4px rgba(13,13,13,.2);opacity:0;pointer-events:none;transition:opacity .15s}
.mk.lbl .mk-l,.mk:hover .mk-l,.mk.sel .mk-l{opacity:1}
.mk.sel{z-index:3}
#markers.far .mk:not(.sel):not(.inplan) .mk-b{transform:scale(.42);background:var(--c);box-shadow:0 0 0 2px #FFFFFF,0 2px 6px rgba(13,13,13,.25)}
#markers.far .mk:not(.sel):not(.inplan) .mk-b svg{opacity:0}
#markers.far .mk:not(.sel):not(.inplan):hover .mk-b{transform:scale(.9)}
#markers.far .mk:not(.sel):not(.inplan):hover .mk-b svg{opacity:1}
.mk:hover{z-index:4}
.mk:focus-visible{outline:none}
.mk:focus-visible .mk-b{outline:2px solid var(--gold);outline-offset:3px}
.olbl{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform;transition:opacity .25s}
.klbl{font-weight:800;font-size:15px;letter-spacing:-.01em;color:#0D0D0D;text-shadow:0 0 2px #FFFFFF,0 0 8px rgba(255,255,255,.95),0 0 18px rgba(255,255,255,.8)}
.klbl.on{color:#364959}
.nlbl{font-weight:600;font-size:12px;color:rgba(13,13,13,.4);letter-spacing:.04em}
/* kecamatan tanpa destinasi pilihan: nama tetap ada, lebih kecil dan redup */
.olbl-k{font-weight:700;font-size:12px;color:rgba(13,13,13,.62);text-shadow:0 0 2px #FFFFFF,0 0 8px rgba(255,255,255,.95),0 0 18px rgba(255,255,255,.8)}
.slbl{font-weight:500;font-style:italic;font-size:12.5px;color:rgba(54,73,89,.6);letter-spacing:.06em}

/* ---------- bar kecamatan ---------- */
#kecbar{position:absolute;z-index:4;left:396px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));height:var(--pf-h);border-radius:18px;padding:8px;display:flex;gap:8px;transition:transform .45s cubic-bezier(.3,.7,.2,1),opacity .3s}
body.exploring #kecbar{transform:translateY(calc(100% + 28px));opacity:0;pointer-events:none}
#kecbar.nudge{animation:nudge 1.2s ease-in-out 2}
@keyframes nudge{0%,100%{box-shadow:0 14px 34px -16px rgba(13,13,13,.28)}50%{box-shadow:0 0 0 3px rgba(54,73,89,.5),0 14px 34px -16px rgba(13,13,13,.28)}}
.kb-tour{flex:none;display:flex;align-items:center;gap:8px;padding:0 16px 0 13px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:13.5px;white-space:nowrap;transition:filter .15s}
.kb-tour:hover{filter:brightness(1.08)}
.kb-tour svg.i{width:17px;height:17px}
.kb-list{flex:1;min-width:0;display:grid;grid-template-columns:repeat(var(--kn,6),minmax(0,1fr));gap:6px}
.kb{display:flex;align-items:center;gap:8px;min-width:0;padding:0 10px 0 8px;border-radius:12px;text-align:left;border:1px solid var(--line);background:rgba(13,13,13,.03);transition:background .15s,border-color .15s}
.kb:hover{background:rgba(13,13,13,.07);border-color:var(--line2)}
.kb[aria-pressed=true],.kb.cur{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.kb.cur{box-shadow:0 0 0 2px var(--c)}
.kb.tap{animation:kbTap .38s cubic-bezier(.16,1,.3,1)}
@keyframes kbTap{0%{transform:scale(1)}35%{transform:scale(.93)}100%{transform:scale(1)}}
.kb.tap svg.kmo{animation:kbIco .5s cubic-bezier(.16,1,.3,1)}
@keyframes kbIco{0%{transform:scale(1) rotate(0)}40%{transform:scale(1.12) rotate(-5deg)}100%{transform:scale(1) rotate(0)}}
/* transisi memasuki kecamatan */
.kt{position:fixed;z-index:25;overflow:hidden;border-radius:18px;pointer-events:none;background:color-mix(in srgb,var(--c) 35%,#111417);transition:left .8s cubic-bezier(.75,0,.2,1),top .8s cubic-bezier(.75,0,.2,1),width .8s cubic-bezier(.75,0,.2,1),height .8s cubic-bezier(.75,0,.2,1),border-radius .8s,opacity .7s ease,transform .8s ease,filter .7s ease}
.kt.full{left:0!important;top:0!important;width:100vw!important;height:100vh!important;border-radius:0}
.kt.out{opacity:0;transform:scale(1.08);filter:blur(8px)}
.kt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.2);transition:transform 2s cubic-bezier(.2,.7,.2,1)}
.kt.full img{transform:scale(1.02)}
.kt svg.kmo{position:absolute;left:50%;top:38%;width:30vmin;height:30vmin;margin:-15vmin 0 0 -15vmin;color:var(--c);opacity:.85}
.kt::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 30%,transparent 30%,rgba(8,9,11,.55)),linear-gradient(180deg,rgba(10,11,13,.1) 35%,rgba(10,11,13,.85))}
.kt-txt{position:absolute;z-index:1;left:0;right:0;bottom:15vh;padding:0 24px;text-align:center;opacity:0;transform:translateY(24px);transition:opacity .5s .4s,transform .7s .4s cubic-bezier(.2,.7,.2,1)}
.kt.full .kt-txt{opacity:1;transform:none}
.kt-txt h2{margin:0;color:#F0F0F2;font-size:clamp(36px,7vw,68px);font-weight:800;letter-spacing:-.03em;line-height:1.05;text-shadow:0 4px 24px rgba(0,0,0,.45)}
.kt-line{display:block;width:0;height:3px;margin:16px auto 0;border-radius:2px;background:var(--c);transition:width .8s .55s cubic-bezier(.2,.7,.2,1)}
.kt.full .kt-line{width:90px}
.kt-txt p{max-width:540px;margin:14px auto 0;font-size:15.5px;line-height:1.55;color:#F0F0F2;text-shadow:0 1px 8px rgba(0,0,0,.6)}
svg.kmo{fill:currentColor}
.kb svg.kmo{width:32px;height:32px;flex:none;color:color-mix(in srgb,var(--c) 55%,#0D0D0D)}
.kb span{min-width:0}
.kb b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;font-weight:700;line-height:1.2}
.kb small{display:block;font-size:12px;color:var(--muted);white-space:nowrap}
/* kartu pratinjau di atas bar */
#kecpop{position:absolute;z-index:6;left:var(--px,50%);bottom:calc(var(--pf-h) + 28px + env(safe-area-inset-bottom));width:320px;margin-left:-160px;border-radius:18px;transform-origin:var(--nx,50%) 100%}
#kecpop[hidden]{display:none}
#kecpop.swap{animation:popUp .42s cubic-bezier(.16,1,.3,1)}
#kecpop::after{content:"";position:absolute;bottom:-7px;left:var(--nx,50%);width:14px;height:14px;margin-left:-7px;transform:rotate(45deg);background:var(--panel-solid);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
@keyframes popUp{from{opacity:0;transform:translateY(14px) scale(.94)}}
#kecpop.swap .kp-hero img,#kecpop.swap .kp-hero svg.kmo{animation:kpZoom .9s cubic-bezier(.2,.7,.2,1)}
@keyframes kpZoom{from{transform:scale(1.25);opacity:.4}}
#kecpop.swap .kp-body>*{animation:trIn .4s cubic-bezier(.2,.7,.2,1) both}
#kecpop.swap .kp-body>:nth-child(2){animation-delay:.06s}
#kecpop.swap .kp-body>:nth-child(3){animation-delay:.12s}
#kecpop.swap .kp-body>:nth-child(4){animation-delay:.18s}
.kp-go{display:block;width:100%;text-align:left;border-radius:18px;overflow:hidden}
.kp-hero{position:relative;height:112px;overflow:hidden;background:color-mix(in srgb,var(--c) 32%,#111417)}
.kp-hero img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.kp-go:hover .kp-hero img{transform:scale(1.05)}
.kp-hero svg.kmo{position:absolute;left:50%;top:50%;width:90px;height:90px;margin:-45px 0 0 -45px;color:var(--c);opacity:.9}
.kp-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(10,11,13,.55))}
.kp-body{padding:12px 14px 14px}
.kp-body h3{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em}
.kp-body p{margin:4px 0 0;font-size:12.5px;line-height:1.5;color:var(--muted)}
.kp-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.kp-meta span{height:24px;padding:0 9px;border-radius:7px;display:inline-flex;align-items:center;background:rgba(13,13,13,.07);font-size:12px;font-weight:600}
.kp-cta{display:flex;align-items:center;gap:6px;margin-top:12px;font-weight:700;font-size:13.5px;color:var(--gold)}
.kp-cta svg.i{width:16px;height:16px;transition:transform .2s}
.kp-go:hover .kp-cta svg.i{transform:translateX(3px)}
.kp-x{position:absolute;z-index:1;top:8px;right:8px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(10,11,13,.6);color:#F0F0F2}
.kp-x svg.i{width:16px;height:16px}
/* kartu besar penjelasan kecamatan */
#kecinfo{position:absolute;z-index:7;top:calc(16px + env(safe-area-inset-top));right:72px;width:420px;max-height:calc(100% - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom));border-radius:24px;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(13,13,13,.18) transparent;animation:bigIn .5s cubic-bezier(.16,1,.3,1)}
#kecinfo[hidden]{display:none}
@keyframes bigIn{from{opacity:0;transform:translateY(16px) scale(.92)}}
/* kartu dirancang muat sekali lihat tanpa scroll: hero pendek, tempat berupa chip ringkas */
.ki-hero{position:relative;height:clamp(118px,19vh,168px);overflow:hidden;background:color-mix(in srgb,var(--c) 32%,#111417)}
.ki-credit{position:absolute;z-index:2;left:14px;top:12px;font-size:11.5px;color:rgba(240,240,242,.75);text-shadow:0 1px 4px rgba(0,0,0,.6)}
.ki-credit:hover{color:#F0F0F2;text-decoration:underline}
.ki-hero img{display:block;width:100%;height:100%;object-fit:cover}
.ki-hero svg.kmo{position:absolute;left:50%;top:44%;width:120px;height:120px;margin:-60px 0 0 -60px;color:var(--c)}
.ki-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,11,13,.1) 30%,rgba(10,11,13,.85))}
.ki-name{position:absolute;z-index:1;left:20px;right:20px;bottom:14px}
.ki-name h2{margin:0;color:#F0F0F2;font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.ki-x{position:absolute;z-index:2;top:12px;right:12px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(10,11,13,.6);color:#F0F0F2}
.ki-x:hover{background:rgba(10,11,13,.85)}
.ki-body{padding:14px 20px 18px}
.ki-lead{margin:0;font-size:14.5px;font-weight:600;line-height:1.45}
.ki-story{margin:6px 0 0;font-size:13px;line-height:1.55;color:#2B3036}
.ki-body .kstats{margin:12px 0 0;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ki-fit{margin:10px 0 0;font-size:12.5px;line-height:1.5;color:var(--muted)}
.ki-fit b{color:var(--text);font-weight:700;margin-right:4px}
.ki-sechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:14px 0 8px}
.ki-sechead .sec{margin:0}
.ki-places{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ki-places li{min-width:0}
.ki-pl{width:100%;height:32px;padding:0 12px 0 5px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;white-space:nowrap;border:1px solid var(--line2);background:rgba(13,13,13,.04);transition:background .15s,border-color .15s}
.ki-pl:hover{background:rgba(13,13,13,.09);border-color:color-mix(in srgb,var(--c) 65%,transparent)}
.ki-pl span:last-child{overflow:hidden;text-overflow:ellipsis}
.ki-pl-i{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 45%,transparent);color:#0D0D0D}
.ki-pl-i svg.i{width:13px;height:13px}
.ki-acts{display:flex;gap:8px;margin-top:16px}
/* layar pendek: cerita disembunyikan (ringkasan tetap) supaya kartu tetap muat tanpa scroll */
@media (min-width:900px) and (max-height:700px),(max-width:899px) and (max-height:780px){ .ki-story{display:none} }
.ki-acts .btn{flex:1;padding:0 12px}
.ki-body>*,.ki-name{animation:trIn .5s cubic-bezier(.2,.7,.2,1) both}
.ki-body>:nth-child(2){animation-delay:.08s}.ki-body>:nth-child(3){animation-delay:.16s}.ki-body>:nth-child(4){animation-delay:.24s}.ki-body>:nth-child(n+5){animation-delay:.3s}
.mk.popin .mk-b{animation:mkIn .6s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--dl,0s)}
.mk.popin .mk-l{animation:fadeIn .4s both;animation-delay:calc(var(--dl,0s) + .15s)}
.plist li.li-in{animation:trIn .35s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*25ms)}
@keyframes mkIn{0%{transform:scale(0)}100%{transform:scale(1)}}
/* layar awal */
/* Layar sambutan: panorama pesisir Kotabaru, judul serif kapital + huruf sambung (nuansa
   buku perjalanan), tombol play, lalu dua pilihan mode.
   Huruf antarmuka lain tetap Plus Jakarta Sans. */
#welcome{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;overflow:hidden;background:#0D0D0D;color:#F0F0F2;animation:fadeIn .6s}
#welcome[hidden]{display:none}
#welcome.out{opacity:0;transition:opacity .6s}
@keyframes fadeIn{from{opacity:0}}
/* video latar tanpa suara; panorama.jpg jadi poster sampai video siap (dan cadangan bila tak bisa diputar) */
.wl-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 58%;opacity:0;transition:opacity 1.2s}
.wl-bg.ready{opacity:1}
.wl-credit{position:absolute;z-index:1;right:14px;bottom:calc(10px + env(safe-area-inset-bottom));font-size:11px;color:rgba(240,240,242,.62);text-decoration:none;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.wl-credit:hover{color:#F0F0F2;text-decoration:underline}
/* tanpa video: panorama diam bergerak pelan (zoom dan geser halus) */
.wl-bg.still{animation:wlDrift 38s ease-in-out infinite alternate}
@keyframes wlDrift{from{transform:scale(1.04) translate(-1%,0)}to{transform:scale(1.14) translate(1.5%,-1%)}}
/* bayangan atas dan bawah: gelap di tepi, memudar menjadi terang menuju tengah */
.wl-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,9,.82) 0%,rgba(8,8,9,.35) 22%,rgba(8,8,9,0) 44%,rgba(8,8,9,0) 56%,rgba(8,8,9,.35) 78%,rgba(8,8,9,.82) 100%)}
/* sapuan gelap lembut tepat di belakang judul supaya terbaca di atas foto */
.wl-shade::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 42% 22% at 50% 52%,rgba(8,8,9,.5),rgba(8,8,9,0) 100%)}
.wl-main{position:relative;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;text-align:center;padding:32px 24px 48px}
.wl-logo{width:auto;height:clamp(72px,12vh,104px);margin-bottom:22px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45));animation:trIn 1s .1s cubic-bezier(.2,.7,.2,1) both}
.wl-h1{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(28px,min(4.2vw,7.5vh),60px);line-height:1.05;letter-spacing:.02em;text-transform:uppercase;text-shadow:0 1px 3px rgba(0,0,0,.45),0 2px 26px rgba(0,0,0,.55);animation:trIn 1s .3s cubic-bezier(.2,.7,.2,1) both}
.wl-script{margin:-.04em 0 0;font-family:'Allura',cursive;font-weight:400;font-size:clamp(30px,min(3.8vw,7vh),54px);line-height:1.1;color:#BFBFBF;text-shadow:0 1px 3px rgba(0,0,0,.5),0 2px 22px rgba(0,0,0,.6);animation:trIn 1s .5s cubic-bezier(.2,.7,.2,1) both}
/* tombol mulai: kapsul dengan lingkaran play dan tulisan Mulai */
.wl-play{margin-top:30px;height:56px;display:inline-flex;align-items:center;gap:14px;padding:0 30px 0 8px;border-radius:999px;border:1px solid rgba(240,240,242,.6);background:rgba(240,240,242,.12);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#F0F0F2;transition:background .25s,border-color .25s,transform .25s,box-shadow .25s;animation:trIn 1s .7s cubic-bezier(.2,.7,.2,1) both}
.wl-play:hover{background:rgba(240,240,242,.22);border-color:rgba(240,240,242,.9);transform:translateY(-1px)}
.wl-play:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(240,240,242,.7)}
.wl-ring{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#F0F0F2;color:#0D0D0D;transition:transform .25s}
.wl-play:hover .wl-ring{transform:scale(1.06)}
.wl-ring svg{width:18px;height:18px;margin-left:2px;fill:currentColor}
.wl-play b{font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
/* langkah kedua (setelah play): tombol play berganti dua pilihan mode */
.wl-opts{display:none;grid-template-columns:1fr 1fr;gap:12px;width:min(640px,100%);margin-top:30px}
#welcome.go .wl-play{display:none}
#welcome.go .wl-opts{display:grid}
#welcome.go .wl-opt{animation:trIn .6s cubic-bezier(.2,.7,.2,1) both}
#welcome.go .wl-opt+.wl-opt{animation-delay:.12s}
.wl-opt{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;column-gap:10px;row-gap:8px;align-content:start;padding:18px;border-radius:18px;border:1px solid rgba(240,240,242,.24);background:rgba(13,13,13,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);text-align:left;color:#F0F0F2;transition:transform .18s,border-color .18s,background .18s}
.wl-opt:hover{transform:translateY(-2px);border-color:rgba(240,240,242,.45);background:rgba(13,13,13,.68)}
.wl-opt.primary{border-color:rgba(191,191,191,.6);background:linear-gradient(140deg,rgba(54,73,89,.75),rgba(13,13,13,.6))}
.wl-opt.primary:hover{border-color:rgba(191,191,191,.9)}
@media (max-height:620px){
  .wl-logo{margin-bottom:14px}
  .wl-play,.wl-opts{margin-top:20px}
}
/* ikon sejajar judul pilihan, tanpa kotak; keterangan di bawahnya selebar kartu */
.wl-ico{display:grid;place-items:center;color:var(--gold)}
.wl-ico svg.i{width:22px;height:22px}
.wl-opt b{font-size:17px;font-weight:800;letter-spacing:-.01em}
.wl-opt>span:not(.wl-ico),.wl-opt em{grid-column:1/-1}
.wl-opt>span:not(.wl-ico){font-size:13px;line-height:1.5;color:#D8D8D9}
.wl-opt em{font-style:normal;font-size:12px;font-weight:600;color:#BFBFBF}

/* ---------- map controls ---------- */
#mapctl{position:absolute;z-index:4;top:calc(16px + env(safe-area-inset-top));right:16px;display:flex;flex-direction:column;gap:8px}
.mbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;transition:background .15s}
.mbtn[hidden]{display:none}
.mbtn:hover{background:#FFFFFF}
#compass svg{transition:transform .1s linear}
#musik svg.i{width:19px;height:19px}
#musik.off{color:var(--faint)}

/* ---------- detail ---------- */
#detail{position:absolute;z-index:6;top:calc(16px + env(safe-area-inset-top));right:72px;width:368px;max-height:calc(100% - var(--pf-h) - 60px);border-radius:22px;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(13,13,13,.18) transparent}
#detail[hidden]{display:none}
.d-hero{position:relative;height:132px;background:#151A1F;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.25)),color-mix(in srgb,var(--kc) 22%,#111417)}
.d-hero svg.sil{position:absolute;left:0;right:0;bottom:0;width:100%;height:96px}
.d-hero.has-photo{height:200px}
.d-hero .d-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.d-credit{margin:6px 0 0;font-size:11.5px;line-height:1.4;color:var(--faint)}
.d-credit a{color:inherit}
.d-cat{position:absolute;left:18px;top:16px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--kc);color:#121519}
.d-cat svg.i{width:20px;height:20px}
.d-elev{position:absolute;left:68px;top:16px;line-height:1.2}
.d-elev b{display:block;color:#F0F0F2;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.d-elev span{font-size:12px;color:rgba(240,240,242,.75)}
.d-close{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(10,11,13,.55);color:#F0F0F2}
.d-close:hover{background:rgba(10,11,13,.8)}
.d-body{padding:16px 20px 22px}
.d-body h2{margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.d-sub{margin:4px 0 0;color:var(--muted);font-size:13px}
.tags{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0;padding:0}
.tag{height:26px;padding:0 10px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:rgba(13,13,13,.07);color:var(--text)}
.tag svg.i{width:14px;height:14px}
.tag.sun{background:rgba(54,73,89,.15);color:var(--gold)}
.tag.beach{background:rgba(54,73,89,.12);color:#364959}
.d-desc{margin:14px 0 0;font-size:14px;line-height:1.6;color:#2B3036}
.d-block{margin:16px 0 0;padding:12px 14px;border-radius:12px;background:rgba(13,13,13,.045)}
.d-block h3{margin:0 0 6px;font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center}
.d-block h3 svg.i{width:16px;height:16px;color:var(--gold)}
.d-block p,.d-block li{font-size:13px;line-height:1.55;color:#2B3036}
.d-block p{margin:0}
.d-block p+p{margin-top:6px}
.d-block ul{margin:0;padding-left:18px}
.d-block li+li{margin-top:4px}
.d-actions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:18px}
.d-actions .btn{padding:0 10px;gap:6px;white-space:nowrap;font-size:13px}
.d-route{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;height:38px;border-radius:12px;font-weight:600;font-size:13px;color:var(--muted);text-decoration:none}
.d-route:hover{color:var(--text);background:rgba(13,13,13,.05)}
.d-route svg.i{width:16px;height:16px}

/* ---------- toast ---------- */
#toast{position:absolute;z-index:9;left:50%;bottom:calc(var(--pf-h) + 40px);transform:translate(-50%,10px);padding:10px 16px;border-radius:12px;background:#0D0D0D;color:#F0F0F2;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

#brandM{display:none}

/* ---------- cerita Telusuri ---------- */
#tour{position:absolute;z-index:6;top:calc(16px + env(safe-area-inset-top));right:72px;width:360px;max-height:calc(100% - var(--pf-h) - 60px);border-radius:22px;overflow:auto;padding:14px 18px 16px;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(13,13,13,.18) transparent}
#tour[hidden]{display:none}
.tr-head{display:flex;align-items:center;gap:10px}
/* konteks bab di baris kontrol kartu cerita (bukan label di atas judul): huruf biasa, warna lembut */
.tr-kick{display:inline-flex;align-items:center;gap:7px;min-width:0;font-size:12.5px;font-weight:600;color:var(--muted)}
.tr-kick i{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c)}
.tr-n{margin-left:auto;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.tr-x{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--muted)}
.tr-x:hover{background:rgba(13,13,13,.07);color:var(--text)}
.tr-x svg.i{width:16px;height:16px}
.tr-x.talking{color:var(--gold)}
.tr-x.talking svg{animation:talk 1s ease-in-out infinite}
@keyframes talk{0%,100%{opacity:.45}50%{opacity:1}}
.tr-x[aria-pressed=true]{color:var(--faint)}
.tr-muted{display:flex;align-items:center;gap:8px;margin:-4px 0 12px;padding:8px 10px;border-radius:10px;background:rgba(54,73,89,.1);color:#364959;font-size:12.5px;font-weight:600}
.tr-muted[hidden]{display:none}
.tr-muted svg.i{width:16px;height:16px;flex:none}
.tr-bar{height:3px;margin:10px 0 14px;border-radius:2px;overflow:hidden;background:rgba(13,13,13,.1)}
.tr-bar i{display:block;width:0;height:100%;background:var(--gold)}
.tr-img{position:relative;height:150px;margin:0 0 12px;border-radius:14px;overflow:hidden;background:rgba(13,13,13,.05)}
.tr-img img{display:block;width:100%;height:100%;object-fit:cover}
.tr-img figcaption{position:absolute;right:8px;bottom:6px;font-size:11.5px;color:rgba(255,255,255,.85);text-shadow:0 1px 3px rgba(0,0,0,.75)}
.tr-title{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.tr-sub{margin:4px 0 0;font-size:13px;color:var(--muted)}
.tr-body>.tr-img,.tr-body>.tr-title,.tr-body>.tr-sub{animation:trIn .45s cubic-bezier(.2,.7,.2,1) both}
.tr-body>.tr-title{animation-delay:.05s}
.tr-body>.tr-sub{animation-delay:.12s}
.tr-pts{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.tr-pts li{position:relative;padding:9px 12px 9px 30px;border-radius:12px;background:rgba(13,13,13,.05);font-size:13.5px;line-height:1.5;color:#2B3036;animation:trIn .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.35s + var(--d)*.9s)}
.tr-pts li::before{content:"";position:absolute;left:12px;top:15px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(54,73,89,.2)}
.tr-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;animation:trIn .45s .4s both}
.tr-acts .btn{height:34px;padding:0 12px;font-size:12.5px;gap:6px}
.tr-acts .btn svg.i{width:15px;height:15px}
.tr-cap{margin-top:12px;font-size:12.5px;color:var(--muted)}
.tr-cap summary{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-weight:600;list-style:none}
.tr-cap summary::-webkit-details-marker{display:none}
.tr-cap summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
.tr-cap[open] summary::before{transform:rotate(45deg)}
.tr-cap p{margin:8px 0 0;line-height:1.55;color:#2B3036}
.tr-ctl{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.tr-ctl .btn{flex:1}
.tr-ctl .ibtn{width:40px;height:40px;border:1px solid var(--line2);border-radius:12px}
@keyframes trIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.mk.pop .mk-b{animation:mkPop .75s cubic-bezier(.16,1,.3,1) both}
.mk.pop .mk-b::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--c);animation:mkRing 1s ease-out both;pointer-events:none}
@keyframes mkPop{0%{transform:scale(0)}100%{transform:scale(1.28)}}
@keyframes mkRing{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.4);opacity:0}}

  #kecpop{left:8px!important;right:8px;width:auto;margin-left:0;bottom:calc(var(--sheet-h) + var(--pf-h) + 22px + env(safe-area-inset-bottom))}

<!-- =========================================================
     DATA DESTINASI
     Ubah atau tambah tempat di sini. Koordinat ada di data
     terrain di bawah (bagian "pos"), dicocokkan lewat id.
     kec: 0 Pulau Laut Sigam, 1 Pulau Laut Utara,
          2 Pulau Laut Tanjung Selayar, 3 Pulau Laut Kepulauan,
          4 Kelumpang Barat (urutan sama dengan awal data terrain;
          17 kecamatan lain tetap digambar dengan warna netral)
     cat: pantai | budaya | alam | rekreasi
     beach: berenang | snorkeling
     sunset / sunrise: spot matahari terbenam / terbit
     goa: tampilkan tips menyusuri goa
     perahu: hanya bisa dicapai dengan perahu (tips menyeberang

     jam / tiket: isi kalau sudah punya datanya, akan tampil
     otomatis di kartu detail.
     elev: isi kalau tahu ketinggian aslinya (meter); kalau

     Sumber koordinat: Sisparnas Kemenpar dan OpenStreetMap;
     titik Kampung Nelayan dan Pantai Risalo masih perkiraan.

   story:'Kecamatan termuda di Kotabaru ini dimekarkan dari Pulau Laut Utara pada 2019. Wilayahnya mencakup pusat kota di tepi Selat Laut dengan Siring Laut sebagai ruang publik utama, lalu memanjang ke pesisir timur: Desa Sarang Tiung dengan kampung nelayan dan Bukit Mamake, serta Pantai Gedambaan.'},
  {name:'Pulau Laut Utara', color:'#A9B86A', motif:'tree', char:'Perbukitan hijau di balik kota: hutan meranti dan panorama Kotabaru dari ketinggian.',

  {name:'Pulau Laut Tanjung Selayar', color:'#D9C9A0', motif:'wave', char:'Ujung barat daya Pulau Laut: pantai pasir putih, air jernih, dan karang, ± 4 jam dari kota.',

<!-- =========================================================
     NARATOR
     Memutar audio/narasi/<kunci>.mp3 (naskah di window.NARASI),
     satu klip pada satu waktu. Dipakai cerita Telusuri dan salam pembuka.
     Pilihan suara on/off diingat di browser pengunjung.
     ========================================================= -->
<script>
window.NARATOR = (function(){
'use strict';
const STORE = 'terra-kotabaru-narator', BASE = 'audio/narasi/';
/* klip diputar sedikit lebih lambat agar tidak terdengar terburu-buru; nada suara tetap */
const RATE = 0.9;
let muted = false;
try { muted = localStorage.getItem(STORE) === 'off'; } catch (e) {}
const el = new Audio(); el.preload = 'auto';
el.preservesPitch = el.mozPreservesPitch = el.webkitPreservesPitch = true;
el.defaultPlaybackRate = el.playbackRate = RATE;
let key = null, onEnd = null, fadeIn = 0, fadeT = 0, intro = null, introT = 0;
const subs = [], stateSubs = [];
const emit = ev => stateSubs.forEach(fn => fn(ev));
const finish = failed => { const f = onEnd; onEnd = null; if (f) f(!!failed); };
el.addEventListener('ended', () => { finish(false); emit('ended'); });
el.addEventListener('error', () => { if (key) finish(true); emit('error'); });
el.addEventListener('playing', () => {
  /* fade in dihitung sejak suara benar-benar mulai, bukan sejak play() dipanggil */
  if (fadeIn) {
    const t0 = performance.now(), dur = fadeIn*1000;
    fadeIn = 0; clearInterval(fadeT);
    fadeT = setInterval(() => { const v = Math.min(1, (performance.now() - t0)/dur); el.volume = v; if (v >= 1) { clearInterval(fadeT); fadeT = 0; } }, 30);
  }
  /* bagian awal diputar lebih lambat, lalu kembali ke RATE di jeda setelahnya */
  if (intro && !introT) {
    el.playbackRate = el.currentTime < intro.until ? intro.rate : RATE;
    introT = setInterval(() => { if (el.currentTime >= intro.until) { el.playbackRate = RATE; intro = null; clearInterval(introT); introT = 0; } }, 20);
  }
  emit('playing');
});
el.addEventListener('pause', () => emit('pause'));
/* putar klip; done(failed) dipanggil saat selesai. opt.fade = lama fade in (detik);
   opt.intro = {until, rate}: sampai detik ke-until klip diputar dengan kecepatan rate.
   Mengembalikan false bila tidak diputar. */
function play(k, done, opt){
  stop();
  if (muted || !window.NARASI || !window.NARASI[k]) return false;
  key = k; onEnd = done || null;
  fadeIn = opt && opt.fade || 0;
  intro = opt && opt.intro || null;
  el.volume = fadeIn ? 0 : 1;
  el.src = BASE + k + '.mp3';   /* sumber baru selalu mulai dari awal; jangan seek di sini */
  el.playbackRate = intro ? intro.rate : RATE;
  const p = el.play();
  /* browser bisa menahan suara (belum ada interaksi pengguna): kabari tampilan */
  if (p && p.catch) p.catch(err => { if (key === k) { key = null; finish(true); if (err && err.name === 'NotAllowedError') emit('blocked'); } });
  return true;
}

/* ============== geometri dasar ============== */
const G = T.grid, NX = G.nx, NZ = G.nz;
/* 1 satuan dunia = SC km: Kotabaru (± 120 × 290 km) diperkecil supaya seukuran diorama.
   EXAG = satuan per km ketinggian, jadi relief dibesarkan EXAG*SC kali. */
const SC = 4.5;
const KMX = 111.2*Math.cos(3.62*Math.PI/180)/SC, KMZ = 110.6/SC;
const LONC = 116.064, LATC = -3.625;
const EXAG = 2.0, SLAB = 0.6;
const toX = lon => (lon - LONC)*KMX;
const toZ = lat => -(lat - LATC)*KMZ;
const toLon = x => x/KMX + LONC;
const toLat = z => LATC - z/KMZ;
const hToY = h => SLAB + h/1000*EXAG;
function b64(s){ const bin = atob(s); const u = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return u; }
/* K disimpan RLE [nilai, panjang (varint)]; H hanya untuk sel daratan, urut baris */
const K = new Uint8Array(NX*NZ), H = new Uint16Array(NX*NZ);
{
  const r = b64(T.Kr); let v = 0;
  for (let p = 0; p < r.length;) { const val = r[p++]; let n = 0, sh = 0, c; do { c = r[p++]; n |= (c & 127) << sh; sh += 7; } while (c & 128); K.fill(val, v, v + n); v += n; }
  const hl = new Uint16Array(b64(T.Hl).buffer); let q = 0;
  for (let o = 0; o < K.length; o++) if (K[o]) H[o] = hl[q++];
}
/* KEC = kecamatan yang punya destinasi (urutan sama dengan awal T.kec); sisanya tetap digambar, warnanya netral */
const NK = T.kec.length;
const KALL = T.kec.map((m, i) => KEC[i] || {name:m.name, color:['#D2D5D9','#DADCDF','#CBCFD3'][i % 3], other:true, label:m.label, hmin:m.hmin, hmax:m.hmax, area:m.area_km2});
function hAt(lon, lat){
  const fi = clamp((lon - G.lon0)/G.d, 0, NX-1.001), fj = clamp((G.latT - lat)/G.d, 0, NZ-1.001);
  const i = Math.floor(fi), j = Math.floor(fj), u = fi-i, v = fj-j, o = j*NX+i;
  return (H[o]*(1-u) + H[o+1]*u)*(1-v) + (H[o+NX]*(1-u) + H[o+NX+1]*u)*v;
}
function kecAt(lon, lat){
  const i = Math.round((lon - G.lon0)/G.d), j = Math.round((G.latT - lat)/G.d);
  if (i < 0 || j < 0 || i >= NX || j >= NZ) return -1;
  return K[j*NX+i] - 1;
}

/* profil per baris grid (selatan -> utara) */
const ROWS = [];
for (let j = NZ-1; j >= 0; j--) {
  let mx = 0, sx = 0, n = 0; const cnt = new Array(NK + 1).fill(0);
  for (let i = 0; i < NX; i++) { const o = j*NX+i; if (K[o]) { mx = Math.max(mx, H[o]); sx += i; n++; cnt[K[o]]++; } }
  if (n) ROWS.push({lat:G.latT - j*G.d, h:mx, cx:toX(G.lon0 + (sx/n)*G.d), k:cnt.indexOf(Math.max(...cnt)) - 1});
}
for (let pass = 0; pass < 2; pass++) { const hs = ROWS.map(r => r.h); for (let i = 1; i < ROWS.length-1; i++) ROWS[i].h = (hs[i-1] + 2*hs[i] + hs[i+1])/4; }
{ const ks = ROWS.map(r => r.k); for (let i = 0; i < ROWS.length; i++) { const c = new Array(NK).fill(0); for (let d = -4; d <= 4; d++) { const v = ks[clamp(i+d, 0, ks.length-1)]; if (v >= 0) c[v]++; } ROWS[i].k = c.indexOf(Math.max(...c)); } }
const LAT_S = ROWS[0].lat, LAT_N = ROWS[ROWS.length-1].lat;
function rowAt(lat){ const t = clamp((lat - LAT_S)/(LAT_N - LAT_S), 0, 1); return ROWS[Math.round(t*(ROWS.length-1))]; }

/* ============== three.js ============== */
const canvas = $('#scene');
if (typeof THREE === 'undefined') {
  const fb = $('#fallback'); fb.hidden = false;
  fb.textContent = 'Peta 3D tidak bisa dimuat karena Three.js gagal diunduh. Pastikan perangkat terhubung ke internet, lalu muat ulang halaman.';
}
const has3D = typeof THREE !== 'undefined';
let renderer, scene, camera, terrain, terrainMat, wallMat, borderLines, stems, routeGroup, fog, treeMats = [];
const treeSets = [];   /* satu grup pohon per kecamatan berdestinasi */
const windU = {value:0};   /* waktu untuk goyangan angin pohon */
const KB = KALL.map(() => ({minX:1e9, maxX:-1e9, minZ:1e9, maxZ:-1e9, sy:0, n:0}));
const uni = {};

function hex3(h){ const c = new THREE.Color(h); return [c.r, c.g, c.b]; }

function buildScene(){
  renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobile ? 1.75 : 2));
  renderer.setClearColor(0x000000, 0);
  scene = new THREE.Scene();
  fog = new THREE.Fog(0xF0F0F2, 80, 260);
  scene.fog = fog;
  camera = new THREE.PerspectiveCamera(32, 1, 0.5, 2000);

  /* ---- terrain ---- */
  const N = NX*NZ, vmap = new Int32Array(N).fill(-1); let vc = 0;
  for (let v = 0; v < N; v++) if (K[v]) vmap[v] = vc++;
  const snap = new Map(T.snaps.map(s => [s[0], [s[1], s[2]]]));
  const pos = new Float32Array(vc*3), kcol = new Float32Array(vc*3), kid = new Float32Array(vc), elev = new Float32Array(vc);
  const cols = KALL.map(k => hex3(k.color));
  for (let v = 0; v < N; v++) {
    const c = vmap[v]; if (c < 0) continue;
    const j = Math.floor(v/NX), i = v - j*NX;
    let lon = G.lon0 + i*G.d, lat = G.latT - j*G.d;
    const s = snap.get(v); if (s) { lon = s[0]; lat = s[1]; }
    const k = K[v]-1, h = H[v];
    const x = toX(lon), z = toZ(lat), y = hToY(h);
    pos[c*3] = x; pos[c*3+1] = y; pos[c*3+2] = z;
    kcol[c*3] = cols[k][0]; kcol[c*3+1] = cols[k][1]; kcol[c*3+2] = cols[k][2];
    kid[c] = k;
    elev[c] = h;
    const b = KB[k]; b.minX = Math.min(b.minX, x); b.maxX = Math.max(b.maxX, x); b.minZ = Math.min(b.minZ, z); b.maxZ = Math.max(b.maxZ, z); b.sy += y; b.n++;
  }
  const idx = [], edges = new Map();
  const addEdge = (a, b, o) => { const key = a < b ? a*vc+b : b*vc+a; const e = edges.get(key); if (e) e[0]++; else edges.set(key, [1, a, b, o]); };
  for (let j = 0; j < NZ-1; j++) for (let i = 0; i < NX-1; i++) {
    const a = vmap[j*NX+i], b = vmap[j*NX+i+1], c = vmap[(j+1)*NX+i], d = vmap[(j+1)*NX+i+1];
    if (a >= 0 && c >= 0 && b >= 0) { idx.push(a, c, b); addEdge(a, c, b); addEdge(c, b, a); addEdge(b, a, c); }
    if (b >= 0 && c >= 0 && d >= 0) { idx.push(b, c, d); addEdge(b, c, d); addEdge(c, d, b); addEdge(d, b, c); }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('kcol', new THREE.BufferAttribute(kcol, 3));
  geo.setAttribute('kid', new THREE.BufferAttribute(kid, 1));
  geo.setAttribute('elev', new THREE.BufferAttribute(elev, 1));
  geo.setIndex(vc > 65535 ? new THREE.Uint32BufferAttribute(idx, 1) : new THREE.Uint16BufferAttribute(idx, 1));
  geo.computeVertexNormals();
  geo.computeBoundingSphere();

  Object.assign(uni, {
    uGrow:{value: reduceMotion ? 1 : 0.001},
    uLight:{value: new THREE.Vector3(0.45, 0.78, 0.38).normalize()},
    uSelK:{value:-1}, uHasSel:{value:0}, uPulse:{value:0},
    uScanZ:{value:0}, uScan:{value:0},
    uFogColor:{value: new THREE.Color(0xF0F0F2)}, uFogNear:{value:80}, uFogFar:{value:260}
  });
  terrainMat = new THREE.ShaderMaterial({
    uniforms: uni,
    vertexShader: `
      attribute vec3 kcol; attribute float kid; attribute float elev;
      uniform float uGrow; uniform float uSelK;
      varying vec3 vCol; varying vec3 vN; varying float vElev; varying float vSel; varying vec3 vW;
      void main(){
        vec3 p = position; p.y *= uGrow;
        /* dibandingkan per titik lalu diinterpolasi: di tepi kecamatan memudar halus, tanpa indeks campuran */
        vCol = kcol; vN = normal; vElev = elev; vSel = 1.0 - step(0.5, abs(kid - uSelK));
        vec4 w = modelMatrix * vec4(p,1.0); vW = w.xyz;
        gl_Position = projectionMatrix * viewMatrix * w;
      }`,
    fragmentShader: `
      uniform vec3 uLight; uniform float uHasSel; uniform float uPulse; uniform float uScanZ; uniform float uScan;
      uniform vec3 uFogColor; uniform float uFogNear; uniform float uFogFar;
      varying vec3 vCol; varying vec3 vN; varying float vElev; varying float vSel; varying vec3 vW;
      float cline(float v, float w){ float f = abs(fract(v - 0.5) - 0.5) / max(fwidth(v), 1e-4); return 1.0 - min(f / w, 1.0); }
      void main(){
        vec3 n = normalize(vN);
        float diff = max(dot(n, uLight), 0.0);
        float hemi = 0.5 + 0.5*n.y;
        float steep = 1.0 - n.y;
        vec3 base = mix(vCol, vCol*vec3(0.82,0.84,0.88), smoothstep(400.0, 1800.0, vElev));
        vec3 col = base * (0.30 + 0.62*diff + 0.22*hemi);
        col *= 1.0 - steep*0.35;
        col += vec3(0.03,0.035,0.045) * diff;
        vec2 q = vW.xz*3.1;
        vec2 iq = floor(q); vec2 fq = fract(q); fq = fq*fq*(3.0-2.0*fq);
        float h00 = fract(sin(dot(iq, vec2(127.1,311.7)))*43758.5), h10 = fract(sin(dot(iq+vec2(1,0), vec2(127.1,311.7)))*43758.5);
        float h01 = fract(sin(dot(iq+vec2(0,1), vec2(127.1,311.7)))*43758.5), h11 = fract(sin(dot(iq+vec2(1,1), vec2(127.1,311.7)))*43758.5);
        float nz = mix(mix(h00,h10,fq.x), mix(h01,h11,fq.x), fq.y);
        col *= 0.95 + 0.09*nz;
        float lum = dot(base, vec3(0.3,0.59,0.11));
        vec3 lc = mix(vec3(0.94,0.94,0.95), base*0.42, smoothstep(0.55, 0.68, lum));
        float c1 = cline(vElev/50.0, 1.0);
        float c2 = cline(vElev/250.0, 1.3);
        col = mix(col, lc, c1*0.09 + c2*0.2);
        float s = clamp(vSel, 0.0, 1.0);
        if (uHasSel > 0.001) {   /* uHasSel 0..1: sorotan kecamatan memudar masuk/keluar */
          float g = dot(col, vec3(0.3,0.59,0.11));
          vec3 dim = mix(mix(vec3(g), col, 0.25), vec3(0.93,0.93,0.94), 0.5);   /* tema terang: memudar ke putih, bukan menggelap */
          col = mix(col, mix(dim, col*1.06, s), uHasSel);
        }
        col += vec3(0.85, 0.90, 0.96) * s * uPulse * 0.32;   /* pendar saat memasuki kecamatan */
        if (uScan > 0.001) {
          float dz = abs(vW.z - uScanZ);
          float band = 1.0 - smoothstep(0.0, 0.9, dz);
          float edge = 1.0 - smoothstep(0.0, fwidth(vW.z)*1.6, dz);
          col = mix(col, col*1.35 + vec3(0.05,0.06,0.08), band*0.55*uScan);
          col = mix(col, vec3(0.92,0.94,0.97), edge*0.9*uScan);
        }
        float dist = length(vW - cameraPosition);
        col = mix(col, uFogColor, smoothstep(uFogNear, uFogFar, dist));
        gl_FragColor = vec4(col, 1.0);
      }`
  });
  terrainMat.extensions = {derivatives:true};
  terrain = new THREE.Mesh(geo, terrainMat);
  scene.add(terrain);

  /* ---- dinding diorama ---- */
  const wp = [], wn = [], wt = [];
  const V = (c) => [pos[c*3], pos[c*3+1], pos[c*3+2]];
  edges.forEach(e => {
    if (e[0] !== 1) return;
    const A = V(e[1]), B = V(e[2]), O = V(e[3]);
    let nx = B[2]-A[2], nz = -(B[0]-A[0]); const L = Math.hypot(nx, nz) || 1; nx /= L; nz /= L;
    const mx = (A[0]+B[0])/2 - O[0], mz = (A[2]+B[2])/2 - O[2];
    if (nx*mx + nz*mz < 0) { nx = -nx; nz = -nz; }
    const TA = A, TB = B, BA = [A[0], 0, A[2]], BB = [B[0], 0, B[2]];
    let tri = [TA, BA, TB, TB, BA, BB], tops = [A[1], A[1], B[1], B[1], A[1], B[1]];
    // cek orientasi muka
    const ux = BA[0]-TA[0], uy = BA[1]-TA[1], uz = BA[2]-TA[2], vx = TB[0]-TA[0], vy = TB[1]-TA[1], vz = TB[2]-TA[2];
    const cx = uy*vz - uz*vy, cz = ux*vy - uy*vx;
    if (cx*nx + cz*nz < 0) { tri = [TA, TB, BA, TB, BB, BA]; tops = [A[1], B[1], A[1], B[1], B[1], A[1]]; }
    tri.forEach((p, q) => { wp.push(p[0], p[1], p[2]); wn.push(nx, 0, nz); wt.push(tops[q]); });
  });
  const wg = new THREE.BufferGeometry();
  wg.setAttribute('position', new THREE.Float32BufferAttribute(wp, 3));
  wg.setAttribute('normal', new THREE.Float32BufferAttribute(wn, 3));
  wg.setAttribute('topY', new THREE.Float32BufferAttribute(wt, 1));
  wallMat = new THREE.ShaderMaterial({
    uniforms: uni,
    vertexShader: `
      attribute float topY; uniform float uGrow;
      varying float vY; varying float vTop; varying vec3 vN; varying vec3 vW;
      void main(){
        vec3 p = position; p.y *= uGrow; vY = p.y; vTop = topY*uGrow; vN = normal;
        vec4 w = modelMatrix*vec4(p,1.0); vW = w.xyz;
        gl_Position = projectionMatrix*viewMatrix*w;
      }`,
    fragmentShader: `
      uniform vec3 uLight; uniform vec3 uFogColor; uniform float uFogNear; uniform float uFogFar;
      varying float vY; varying float vTop; varying vec3 vN; varying vec3 vW;
      void main(){
        float depth = vTop - vY;
        float s = vY*2.6 + sin(vW.x*0.9 + vW.z*0.55)*0.18;
        float band = fract(s);
        vec3 a = vec3(0.74,0.76,0.79), b = vec3(0.82,0.84,0.87), c = vec3(0.64,0.67,0.71);
        vec3 col = mix(a, b, smoothstep(0.42,0.5,band));
        col = mix(col, c, smoothstep(0.82,0.86,band)*0.7);
        col *= 1.0 - clamp(depth*0.09, 0.0, 0.5);
        col = mix(vec3(0.55,0.58,0.62), col, smoothstep(0.04, 0.12, depth));
        float rim = 1.0 - smoothstep(0.0, fwidth(depth)*1.4, depth);
        vec3 wn = normalize(vN); if (!gl_FrontFacing) wn = -wn;
        float diff = max(dot(wn, uLight), 0.0);
        col *= 0.62 + 0.55*diff;
        col = mix(col, vec3(1.0,1.0,1.0), rim*0.85);
        float dist = length(vW - cameraPosition);
        col = mix(col, uFogColor, smoothstep(uFogNear, uFogFar, dist));
        gl_FragColor = vec4(col, 1.0);
      }`
  });
  wallMat.extensions = {derivatives:true};
  wallMat.side = THREE.DoubleSide;
  scene.add(new THREE.Mesh(wg, wallMat));

  /* ---- laut & daratan tetangga ---- */
  const FADE = `
    uniform vec3 uFogColor; uniform float uFogNear; uniform float uFogFar;
    varying vec3 vW;
    float fadeOut(){ float fd = length(vec2(max(abs(vW.x) - 11.0, 0.0), max(abs(vW.z) - 30.0, 0.0))); return smoothstep(3.0, 24.0, fd); }
    vec3 fogIt(vec3 c){ return mix(c, uFogColor, smoothstep(uFogNear, uFogFar, length(vW - cameraPosition))); }`;
  const VS = `varying vec3 vW; void main(){ vec4 w = modelMatrix*vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }`;
  const flatMat = (col, alpha) => new THREE.ShaderMaterial({
    uniforms: Object.assign({uCol:{value:new THREE.Color(col)}, uSea:{value:new THREE.Color(0xD5DBE1)}, uBg:{value:new THREE.Color(0xF0F0F2)}}, {uFogColor:uni.uFogColor, uFogNear:uni.uFogNear, uFogFar:uni.uFogFar}),
    vertexShader: VS,
    fragmentShader: `uniform vec3 uCol; uniform vec3 uSea; uniform vec3 uBg; ${FADE}
      void main(){ float f = fadeOut(); vec3 far = mix(uSea, uBg, f);
        ${alpha ? `gl_FragColor = vec4(fogIt(uCol), ${alpha.toFixed(3)}*(1.0 - f));` : `gl_FragColor = vec4(fogIt(mix(uCol, far, f)), 1.0);`} }`,
    transparent: !!alpha, depthWrite: !alpha
  });
  const sea = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), flatMat(0xD5DBE1));
  sea.rotation.x = -Math.PI/2; sea.position.y = -0.02; scene.add(sea);
  const landMat = flatMat(0xE7E7E9);
  const coastMat = flatMat(0x364959, 0.28);
  T.neighbors.forEach(nb => nb.polys.forEach(rings => {
    const toV2 = r => r.map(p => new THREE.Vector2(toX(p[0]), -toZ(p[1])));
    const shape = new THREE.Shape(toV2(rings[0]));
    rings.slice(1).forEach(h => shape.holes.push(new THREE.Path(toV2(h))));
    const g = new THREE.ShapeGeometry(shape); g.rotateX(-Math.PI/2);
    const m = new THREE.Mesh(g, landMat); m.position.y = 0.0; scene.add(m);
    const lg = new THREE.BufferGeometry().setFromPoints(rings[0].map(p => new THREE.Vector3(toX(p[0]), 0.02, toZ(p[1]))));
    scene.add(new THREE.Line(lg, coastMat));
  }));

  /* ---- batas kecamatan ---- */
  const bp = [];
  T.borders.forEach(line => {
    for (let q = 0; q < line.length-1; q++) {
      const a = line[q], b = line[q+1];
      bp.push(toX(a[0]), hToY(hAt(a[0], a[1])) + 0.05, toZ(a[1]), toX(b[0]), hToY(hAt(b[0], b[1])) + 0.05, toZ(b[1]));
    }
  });
  const bg = new THREE.BufferGeometry(); bg.setAttribute('position', new THREE.Float32BufferAttribute(bp, 3));
  borderLines = new THREE.LineSegments(bg, new THREE.LineBasicMaterial({color:0x364959, transparent:true, opacity:0}));
  scene.add(borderLines);

  /* ---- pepohonan ----
     Hutan tropis low-poly di kecamatan berdestinasi supaya daratan terasa seperti diorama sungguhan.
     Bentuk pohon dimodelkan di Blender (models/*.glb, dibangun ulang dengan tools/pohon/build_trees.py),
     masing-masing di bawah 300 segitiga: tiga pohon bertajuk bulat tak beraturan, pohon raksasa ala
     meranti yang menyembul, dan nyiur di dekat pantai. Warnanya sudah dipanggang di warna titik (gradasi
     tajuk, bercak antar-rumpun, bayangan di celah tajuk dan kaki batang); tiap pohon diberi nada hijau
     sendiri lewat warna instans. Semak rendah dan bayangan lembut di kaki pohon dibuat di sini. Tajuk
     bergoyang pelan tertiup angin. Satu InstancedMesh per bagian per jenis per kecamatan, jadi ribuan
     pohon tetap ringan. Tidak ditanam di sel tepi pantai, pusat kota (Siring Laut), dan Kampung
     Nelayan; pola derau membuat rumpun hutan dan lahan terbuka. */
  scene.add(new THREE.HemisphereLight(0xFFFFFF, 0xA9B497, 0.8));
  const sunL = new THREE.DirectionalLight(0xFFF6E6, 0.7); sunL.position.set(0.45, 0.78, 0.38); scene.add(sunL);
  let seed = 20261105; const rnd = () => (seed = seed*16807 % 2147483647)/2147483647;
  const clumps = (x, z) => Math.sin(x*2.3 + Math.sin(z*1.3)*2.1)*Math.cos(z*1.9 + Math.sin(x*1.1)*1.7);

  /* semak: bola rendah-poligon yang permukaannya diacak; titiknya berbagi sudut jadi bayangannya halus.
     Warna titik = gradasi bawah gelap ke atas terang, nanti dikalikan warna tiap semak. */
  function blob(rx, ry, lumpy, ws, hs, k){
    const g = new THREE.SphereGeometry(1, ws, hs), p = g.attributes.position, col = [];
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      const n = 1 + lumpy*Math.sin(x*5.1 + k)*Math.sin(y*4.3 + k*1.7)*Math.sin(z*4.7 + k*0.6);
      p.setXYZ(i, x*rx*n, y*ry*n, z*rx*n);
      const v = 0.58 + 0.55*(y + 1)/2;
      col.push(v, v, v);
    }
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.computeVertexNormals();
    return g;
  }
  const bushGeo = blob(0.022, 0.016, 0.22, 6, 4, 11).translate(0, 0.012, 0);
  const shadowGeo = new THREE.CircleGeometry(1, 8).rotateX(-Math.PI/2);

  /* model pohon: 1 m di Blender = 0,01 unit dunia; pangkal batang di titik asal. Tiap GLB punya dua
     bagian, MAT-daun (tajuk/pelepah/buah) dan MAT-batang. glTF menyimpan warna titik dalam ruang linear,
     sedangkan peta ini menggambar tanpa manajemen warna, jadi warnanya dikembalikan ke sRGB. */
  const toSRGB = x => x < 0.0031308 ? x*12.92 : 1.055*Math.pow(x, 1/2.4) - 0.055;
  function treeParts(name, gltf){
    const parts = {};
    gltf.scene.updateMatrixWorld(true);
    gltf.scene.traverse(o => {
      if (!o.isMesh) return;
      const g = o.geometry.clone().applyMatrix4(o.matrixWorld).scale(0.01, 0.01, 0.01), c = g.attributes.color;
      if (c) for (let i = 0; i < c.count; i++) c.setXYZ(i, toSRGB(c.getX(i)), toSRGB(c.getY(i)), toSRGB(c.getZ(i)));
      parts[/batang/.test(o.material.name) ? 'bark' : 'leaf'] = g;
    });
    if (!parts.leaf || !parts.bark) throw new Error(name + ': bagian daun/batang tidak ditemukan');
    parts.leaf.computeBoundingBox();
    const bb = parts.leaf.boundingBox;
    parts.r = ((bb.max.x - bb.min.x) + (bb.max.z - bb.min.z))/4*0.95;   /* jari-jari bayangan = setengah lebar tajuk */
    return parts;
  }
  /* GLB ditanam sebagai base64 di #tree-models (tools/pohon/inject.js) supaya peta tetap satu berkas
     dan pohon ikut tampil walau index.html dibuka langsung; berkas models/ hanya cadangan */
  const TREE_DATA = (() => { try { return JSON.parse(document.getElementById('tree-models').textContent); } catch (e) { return {}; } })();
  const fromB64 = b => { const s = atob(b), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u.buffer; };
  const loadTree = name => new Promise((ok, fail) => {
    const done = gltf => { try { ok(treeParts(name, gltf)); } catch (e) { fail(e); } };
    if (TREE_DATA[name]) new THREE.GLTFLoader().parse(fromB64(TREE_DATA[name]), '', done, fail);
    else new THREE.GLTFLoader().load('models/' + name + '.glb', done, undefined, fail);
  });

  /* angin: ujung tajuk dan pelepah bergeser pelan, fasenya beda tiap pohon */
  const sway = m => { m.onBeforeCompile = sh => {
    sh.uniforms.uWind = windU;
    sh.vertexShader = 'uniform float uWind;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
      #ifdef USE_INSTANCING
        float ph = instanceMatrix[3].x*9.0 + instanceMatrix[3].z*7.0;

/* ============== panel: rencana ============== */
const DUR_DEF = {pantai:90, budaya:60, alam:90, rekreasi:150};
const DUR_OPT = [30, 45, 60, 90, 120, 150, 180, 240];
const MAX_STOPS = 8;
function hav(a, b){ const R = 6371, dLat = (b.lat-a.lat)*Math.PI/180, dLon = (b.lon-a.lon)*Math.PI/180; const s = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(s)); }
const pulauOf = d => { const n = KEC[d.kec].name; return n.startsWith('Pulau Laut') ? 'laut' : n.startsWith('Pulau ') ? n : 'darat'; };
function travel(a, b){
  const km = hav(a, b)*1.35;
  /* jalan darat ± 35 km/jam; pulau kecil: perahu ± 18 km/jam + naik-turun perahu;
     Pulau Laut ↔ daratan Kalimantan: tambah penyeberangan feri */
  let min;
  if (a.perahu || b.perahu) min = hav(a, b)*1.15/18*60 + 30;
  else min = km/35*60 + (pulauOf(a) !== pulauOf(b) ? 90 : 0);
  return {km, min:Math.max(5, Math.round(min/5)*5)};
}
function planTimes(){
  const [hh, mm] = state.start.split(':').map(Number);
  let t = (hh||8)*60 + (mm||0), drive = 0; const out = [];
  state.plan.forEach((s, i) => {
    let leg = null;
    if (i > 0) { leg = travel(BY[state.plan[i-1].id], BY[s.id]); t += leg.min; drive += leg.min; }
    out.push({arr:t, dep:t + s.dur, leg}); t += s.dur;
  });
  return {stops:out, end:t, drive};
}
function renderRencana(){
  const n = state.plan.length;

        <div class="stime"><span>${fmtTime(x.arr)}–${fmtTime(x.dep)}</span>
          <label><span class="sr">Lama kunjungan ${esc(d.name)}</span><select data-dur="${i}">${DUR_OPT.map(o => `<option value="${o}" ${o === st.dur ? 'selected' : ''}>${fmtDur(o)}</option>`).join('')}</select></label>
        </div></div>
      <div class="sctl">
        <button class="ibtn" data-up="${i}" ${i === 0 ? 'disabled' : ''} aria-label="Naikkan ${esc(d.name)}">${icon('up')}</button>
        <button class="ibtn" data-down="${i}" ${i === n-1 ? 'disabled' : ''} aria-label="Turunkan ${esc(d.name)}">${icon('down')}</button>
        <button class="ibtn" data-rm="${i}" aria-label="Hapus ${esc(d.name)} dari rencana">${icon('x')}</button>
      </div></li>`;
  });
  s += '</ol>';
  s += `<p class="summary">Selesai sekitar <strong>${fmtTime(tm.end)} WITA</strong>. Total di jalan ± ${fmtDur(tm.drive)}.</p>`;
  if (tm.end > 20*60) s += `<div class="hint">${icon('info')}<div>Rencana ini selesai lewat pukul 20.00. Pertimbangkan membaginya menjadi dua hari atau mengurangi lama kunjungan.</div></div>`;

  if (b.dataset.up) { const i = +b.dataset.up; [P2[i-1], P2[i]] = [P2[i], P2[i-1]]; }

function optimizePlan(){
  const rest = state.plan.slice(1), out = [state.plan[0]];
  while (rest.length) {
    const cur = BY[out[out.length-1].id]; let bi = 0, bd = 1e9;
    rest.forEach((s, i) => { const d = hav(cur, BY[s.id]); if (d < bd) { bd = d; bi = i; } });
    out.push(rest.splice(bi, 1)[0]);
  }
  const si = out.findIndex(s => BY[s.id].sunset);
  if (si >= 0 && si !== out.length - 1 && out.filter(s => BY[s.id].sunset).length === 1) out.push(out.splice(si, 1)[0]);
  state.plan = out;
  toast('Urutan rencana disusun ulang berdasarkan jarak terdekat');
}

  if (i >= 0) { state.plan.splice(i, 1); toast(`${BY[id].name} dihapus dari rencana`); }
  else {
    if (state.plan.length >= MAX_STOPS) { toast(`Rencana sehari maksimal ${MAX_STOPS} tempat`); return; }
    state.plan.push({id, dur:DUR_DEF[BY[id].cat]}); toast(`${BY[id].name} ditambahkan ke rencana`);
  }
  planChanged();
}
