  mq = matchMedia('(max-width: 899px)');
  rootEl.querySelectorAll('.gk-mode').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
  rootEl.querySelectorAll('.gk-mood').forEach(b => b.addEventListener('click', () => setMood(b.dataset.mood)));
  document.getElementById('gk-close').addEventListener('click', close);
  if (window.NARATOR) {
    document.getElementById('gk-vol').addEventListener('click', () => NARATOR.setMuted(!NARATOR.isMuted()));
    NARATOR.onMute(syncVol); syncVol();
    NARATOR.onState(() => document.getElementById('gk-vol').classList.toggle('talking', open_ && NARATOR.isTalking()));
  } else document.getElementById('gk-vol').hidden = true;
  sideEl.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    if (b.dataset.hot) selectHot(b.dataset.hot);
    else if (b.hasAttribute('data-back')) { hot = null; hush(); call('unselectAnnotation'); look(HOME); renderSide(); }
    else if (b.hasAttribute('data-home')) { call('unselectAnnotation'); look(HOME); }
    else if (b.dataset.ch !== undefined) { chapter = Math.max(0, Math.min(CHAPTERS.length - 1, +b.dataset.ch)); showChapter(); }
    else if (b.dataset.mode) setMode(b.dataset.mode);
  });
}

function open(o){
  o = o || {};
  if (!rootEl) init();
  if (open_) return;
  open_ = true; onCloseCb = o.onClose || null; lastFocus = document.activeElement;
  rootEl.hidden = false; void rootEl.offsetWidth; rootEl.classList.add('on');
  window.addEventListener('keydown', onKey, true);
  mode = 'jelajah'; hot = null;
  rootEl.querySelectorAll('.gk-mode').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === 'jelajah'));
  setMood(moodName);
  if (status === 'idle') start();
  else if (status === 'ready') { call('unselectAnnotation'); showHots(true); look(HOME, 0); }
  say('gwk-intro');
  renderSide();
  setTimeout(() => document.getElementById('gk-close').focus({preventScroll:true}), 40);
}
function close(){
  if (!open_) return;
  open_ = false;
  hush();
  window.removeEventListener('keydown', onKey, true);
  rootEl.classList.remove('on');
  setTimeout(() => { if (!open_) rootEl.hidden = true; }, mq && mq.matches ? 300 : 450);
  const cb = onCloseCb; onCloseCb = null;
  if (cb) cb(); else if (lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true});
}

return {open, close, isOpen:() => open_};
})();

/* ============== geometri dasar ============== */
const G = T.grid, NX = G.nx, NZ = G.nz;
const KMX = 110.9*Math.cos(8.55*Math.PI/180), KMZ = 110.9;
const LONC = 115.166, LATC = -8.546;
const EXAG = 4.5, SLAB = 0.9;
const toX = lon => (lon - LONC)*KMX;
const toZ = lat => -(lat - LATC)*KMZ;
const toLon = x => x/KMX + LONC;
const toLat = z => LATC - z/KMZ;
const hToY = h => SLAB + h/1000*EXAG;
function b64(s){ const bin = atob(s); const u = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return u; }
const H = new Uint16Array(b64(T.H).buffer);
const K = b64(T.K);
function hAt(lon, lat){
  const fi = clamp((lon - G.lon0)/G.d, 0, NX-1.001), fj = clamp((G.latT - lat)/G.d, 0, NZ-1.001);
  const i = Math.floor(fi), j = Math.floor(fj), u = fi-i, v = fj-j, o = j*NX+i;
  return (H[o]*(1-u) + H[o+1]*u)*(1-v) + (H[o+NX]*(1-u) + H[o+NX+1]*u)*v;
}
function kecAt(lon, lat){
  const i = Math.round((lon - G.lon0)/G.d), j = Math.round((G.latT - lat)/G.d);
  if (i < 0 || j < 0 || i >= NX || j >= NZ) return -1;
  return K[j*NX+i] - 1;
}

/* profil per baris grid (selatan -> utara) */
const ROWS = [];
for (let j = NZ-1; j >= 0; j--) {
  let mx = 0, sx = 0, n = 0; const cnt = [0,0,0,0,0,0,0];
  for (let i = 0; i < NX; i++) { const o = j*NX+i; if (K[o]) { mx = Math.max(mx, H[o]); sx += i; n++; cnt[K[o]]++; } }
  if (n) ROWS.push({lat:G.latT - j*G.d, h:mx, cx:toX(G.lon0 + (sx/n)*G.d), k:cnt.indexOf(Math.max(...cnt)) - 1});
}
for (let pass = 0; pass < 2; pass++) { const hs = ROWS.map(r => r.h); for (let i = 1; i < ROWS.length-1; i++) ROWS[i].h = (hs[i-1] + 2*hs[i] + hs[i+1])/4; }
{ const ks = ROWS.map(r => r.k); for (let i = 0; i < ROWS.length; i++) { const c = [0,0,0,0,0,0]; for (let d = -4; d <= 4; d++) { const v = ks[clamp(i+d, 0, ks.length-1)]; if (v >= 0) c[v]++; } ROWS[i].k = c.indexOf(Math.max(...c)); } }
const LAT_S = ROWS[0].lat, LAT_N = ROWS[ROWS.length-1].lat;
function rowAt(lat){ const t = clamp((lat - LAT_S)/(LAT_N - LAT_S), 0, 1); return ROWS[Math.round(t*(ROWS.length-1))]; }

/* ============== three.js ============== */

const has3D = typeof THREE !== 'undefined';

/* GWK punya penanda khusus dan tampilan 3D Sketchfab (skrip GWK3D) */
const hasGwk = !!window.GWK3D;
const KB = KEC.map(() => ({minX:1e9, maxX:-1e9, minZ:1e9, maxZ:-1e9, sy:0, n:0}));
const uni = {};

function hex3(h){ const c = new THREE.Color(h); return [c.r, c.g, c.b]; }

function buildScene(){
  renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobile ? 1.75 : 2));
  renderer.setClearColor(0x000000, 0);
  scene = new THREE.Scene();
  fog = new THREE.Fog(0x0D1B17, 80, 260);
  scene.fog = fog;
  camera = new THREE.PerspectiveCamera(32, 1, 0.5, 2000);

  /* ---- terrain ---- */
  const N = NX*NZ, vmap = new Int32Array(N).fill(-1); let vc = 0;
  for (let v = 0; v < N; v++) if (K[v]) vmap[v] = vc++;
  const snap = new Map(T.snaps.map(s => [s[0], [s[1], s[2]]]));
  const pos = new Float32Array(vc*3), kcol = new Float32Array(vc*3), kA = new Float32Array(vc*3), kB = new Float32Array(vc*3), elev = new Float32Array(vc);
  const cols = KEC.map(k => hex3(k.color));
  for (let v = 0; v < N; v++) {
    const c = vmap[v]; if (c < 0) continue;
    const j = Math.floor(v/NX), i = v - j*NX;
    let lon = G.lon0 + i*G.d, lat = G.latT - j*G.d;
    const s = snap.get(v); if (s) { lon = s[0]; lat = s[1]; }
    const k = K[v]-1, h = H[v];
    const x = toX(lon), z = toZ(lat), y = hToY(h);
    pos[c*3] = x; pos[c*3+1] = y; pos[c*3+2] = z;
    kcol[c*3] = cols[k][0]; kcol[c*3+1] = cols[k][1]; kcol[c*3+2] = cols[k][2];
    if (k < 3) kA[c*3+k] = 1; else kB[c*3+k-3] = 1;
    elev[c] = h;
    const b = KB[k]; b.minX = Math.min(b.minX, x); b.maxX = Math.max(b.maxX, x); b.minZ = Math.min(b.minZ, z); b.maxZ = Math.max(b.maxZ, z); b.sy += y; b.n++;
  }
  const idx = [], edges = new Map();
  const addEdge = (a, b, o) => { const key = a < b ? a*vc+b : b*vc+a; const e = edges.get(key); if (e) e[0]++; else edges.set(key, [1, a, b, o]); };
  for (let j = 0; j < NZ-1; j++) for (let i = 0; i < NX-1; i++) {
    const a = vmap[j*NX+i], b = vmap[j*NX+i+1], c = vmap[(j+1)*NX+i], d = vmap[(j+1)*NX+i+1];
    if (a >= 0 && c >= 0 && b >= 0) { idx.push(a, c, b); addEdge(a, c, b); addEdge(c, b, a); addEdge(b, a, c); }
    if (b >= 0 && c >= 0 && d >= 0) { idx.push(b, c, d); addEdge(b, c, d); addEdge(c, d, b); addEdge(d, b, c); }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('kcol', new THREE.BufferAttribute(kcol, 3));
  geo.setAttribute('kA', new THREE.BufferAttribute(kA, 3));
  geo.setAttribute('kB', new THREE.BufferAttribute(kB, 3));
  geo.setAttribute('elev', new THREE.BufferAttribute(elev, 1));
  geo.setIndex(vc > 65535 ? new THREE.Uint32BufferAttribute(idx, 1) : new THREE.Uint16BufferAttribute(idx, 1));
  geo.computeVertexNormals();
  geo.computeBoundingSphere();

  Object.assign(uni, {
    uGrow:{value: reduceMotion ? 1 : 0.001},
    uLight:{value: new THREE.Vector3(0.45, 0.78, 0.38).normalize()},
    hA:{value: new THREE.Vector3()}, hB:{value: new THREE.Vector3()}, uHasSel:{value:0}, uPulse:{value:0},
    uScanZ:{value:0}, uScan:{value:0},
    uFogColor:{value: new THREE.Color(0x0D1B17)}, uFogNear:{value:80}, uFogFar:{value:260}
  });
  terrainMat = new THREE.ShaderMaterial({
    uniforms: uni,
    vertexShader: `
      attribute vec3 kcol; attribute vec3 kA; attribute vec3 kB; attribute float elev;
      uniform float uGrow; uniform vec3 hA; uniform vec3 hB;
      varying vec3 vCol; varying vec3 vN; varying float vElev; varying float vSel; varying vec3 vW;
      void main(){
        vec3 p = position; p.y *= uGrow;
        vCol = kcol; vN = normal; vElev = elev; vSel = dot(kA,hA) + dot(kB,hB);
        vec4 w = modelMatrix * vec4(p,1.0); vW = w.xyz;
        gl_Position = projectionMatrix * viewMatrix * w;
      }`,
    fragmentShader: `
      uniform vec3 uLight; uniform float uHasSel; uniform float uPulse; uniform float uScanZ; uniform float uScan;
      uniform vec3 uFogColor; uniform float uFogNear; uniform float uFogFar;
      varying vec3 vCol; varying vec3 vN; varying float vElev; varying float vSel; varying vec3 vW;
      float cline(float v, float w){ float f = abs(fract(v - 0.5) - 0.5) / max(fwidth(v), 1e-4); return 1.0 - min(f / w, 1.0); }
      void main(){
        vec3 n = normalize(vN);
        float diff = max(dot(n, uLight), 0.0);
        float hemi = 0.5 + 0.5*n.y;
        float steep = 1.0 - n.y;
        vec3 base = mix(vCol, vCol*vec3(0.78,0.86,0.80), smoothstep(400.0, 1800.0, vElev));
        vec3 col = base * (0.30 + 0.62*diff + 0.22*hemi);
        col *= 1.0 - steep*0.35;
        col += vec3(0.07,0.035,0.0) * diff;
        vec2 q = vW.xz*3.1;
        vec2 iq = floor(q); vec2 fq = fract(q); fq = fq*fq*(3.0-2.0*fq);
        float h00 = fract(sin(dot(iq, vec2(127.1,311.7)))*43758.5), h10 = fract(sin(dot(iq+vec2(1,0), vec2(127.1,311.7)))*43758.5);
        float h01 = fract(sin(dot(iq+vec2(0,1), vec2(127.1,311.7)))*43758.5), h11 = fract(sin(dot(iq+vec2(1,1), vec2(127.1,311.7)))*43758.5);
        float nz = mix(mix(h00,h10,fq.x), mix(h01,h11,fq.x), fq.y);
        col *= 0.95 + 0.09*nz;
        float lum = dot(base, vec3(0.3,0.59,0.11));
        vec3 lc = mix(vec3(0.97,0.92,0.82), base*0.42, smoothstep(0.55, 0.68, lum));
        float c1 = cline(vElev/50.0, 1.0);
        float c2 = cline(vElev/250.0, 1.3);
        col = mix(col, lc, c1*0.16 + c2*0.32);
        float s = clamp(vSel, 0.0, 1.0);
        if (uHasSel > 0.001) {   /* uHasSel 0..1: sorotan kecamatan memudar masuk/keluar */
          float g = dot(col, vec3(0.3,0.59,0.11));
          vec3 dim = mix(vec3(g), col, 0.3) * 0.5;
          col = mix(col, mix(dim, col*1.06, s), uHasSel);
        }
        col += vec3(1.0, 0.86, 0.6) * s * uPulse * 0.32;   /* pendar saat memasuki kecamatan */
        if (uScan > 0.001) {
          float dz = abs(vW.z - uScanZ);
          float band = 1.0 - smoothstep(0.0, 0.9, dz);
          float edge = 1.0 - smoothstep(0.0, fwidth(vW.z)*1.6, dz);
          col = mix(col, col*1.35 + vec3(0.10,0.05,0.0), band*0.55*uScan);
          col = mix(col, vec3(1.0,0.86,0.66), edge*0.9*uScan);
        }
        float dist = length(vW - cameraPosition);
        col = mix(col, uFogColor, smoothstep(uFogNear, uFogFar, dist));
        gl_FragColor = vec4(col, 1.0);
      }`
  });
  terrainMat.extensions = {derivatives:true};
  terrain = new THREE.Mesh(geo, terrainMat);
  scene.add(terrain);

  /* ---- dinding diorama ---- */
  const wp = [], wn = [], wt = [];
  const V = (c) => [pos[c*3], pos[c*3+1], pos[c*3+2]];
  edges.forEach(e => {
    if (e[0] !== 1) return;
    const A = V(e[1]), B = V(e[2]), O = V(e[3]);
    let nx = B[2]-A[2], nz = -(B[0]-A[0]); const L = Math.hypot(nx, nz) || 1; nx /= L; nz /= L;
    const mx = (A[0]+B[0])/2 - O[0], mz = (A[2]+B[2])/2 - O[2];
    if (nx*mx + nz*mz < 0) { nx = -nx; nz = -nz; }
    const TA = A, TB = B, BA = [A[0], 0, A[2]], BB = [B[0], 0, B[2]];
    let tri = [TA, BA, TB, TB, BA, BB], tops = [A[1], A[1], B[1], B[1], A[1], B[1]];
    // cek orientasi muka
    const ux = BA[0]-TA[0], uy = BA[1]-TA[1], uz = BA[2]-TA[2], vx = TB[0]-TA[0], vy = TB[1]-TA[1], vz = TB[2]-TA[2];
    const cx = uy*vz - uz*vy, cz = ux*vy - uy*vx;
    if (cx*nx + cz*nz < 0) { tri = [TA, TB, BA, TB, BB, BA]; tops = [A[1], B[1], A[1], B[1], B[1], A[1]]; }
    tri.forEach((p, q) => { wp.push(p[0], p[1], p[2]); wn.push(nx, 0, nz); wt.push(tops[q]); });
  });
  const wg = new THREE.BufferGeometry();
  wg.setAttribute('position', new THREE.Float32BufferAttribute(wp, 3));
  wg.setAttribute('normal', new THREE.Float32BufferAttribute(wn, 3));
  wg.setAttribute('topY', new THREE.Float32BufferAttribute(wt, 1));
  wallMat = new THREE.ShaderMaterial({
    uniforms: uni,
    vertexShader: `
      attribute float topY; uniform float uGrow;
      varying float vY; varying float vTop; varying vec3 vN; varying vec3 vW;
      void main(){
        vec3 p = position; p.y *= uGrow; vY = p.y; vTop = topY*uGrow; vN = normal;
        vec4 w = modelMatrix*vec4(p,1.0); vW = w.xyz;
        gl_Position = projectionMatrix*viewMatrix*w;
      }`,
    fragmentShader: `
      uniform vec3 uLight; uniform vec3 uFogColor; uniform float uFogNear; uniform float uFogFar;
      varying float vY; varying float vTop; varying vec3 vN; varying vec3 vW;
      void main(){
        float depth = vTop - vY;
        float s = vY*2.6 + sin(vW.x*0.9 + vW.z*0.55)*0.18;
        float band = fract(s);
        vec3 a = vec3(0.40,0.27,0.19), b = vec3(0.50,0.34,0.23), c = vec3(0.31,0.21,0.16);
        vec3 col = mix(a, b, smoothstep(0.42,0.5,band));
        col = mix(col, c, smoothstep(0.82,0.86,band)*0.7);
        col *= 1.0 - clamp(depth*0.09, 0.0, 0.5);
        col = mix(vec3(0.17,0.14,0.10), col, smoothstep(0.04, 0.12, depth));

        float diff = max(dot(wn, uLight), 0.0);
        col *= 0.62 + 0.55*diff;
        col = mix(col, vec3(0.96,0.89,0.76), rim*0.85);
        float dist = length(vW - cameraPosition);
        col = mix(col, uFogColor, smoothstep(uFogNear, uFogFar, dist));
        gl_FragColor = vec4(col, 1.0);
      }`
  });
  wallMat.extensions = {derivatives:true};
  wallMat.side = THREE.DoubleSide;
  scene.add(new THREE.Mesh(wg, wallMat));

  /* ---- laut & daratan tetangga ---- */
  const FADE = `
    uniform vec3 uFogColor; uniform float uFogNear; uniform float uFogFar;
    varying vec3 vW;
    float fadeOut(){ float fd = length(vec2(max(abs(vW.x - 0.5) - 6.0, 0.0), max(abs(vW.z) - 31.0, 0.0))); return smoothstep(3.0, 24.0, fd); }
    vec3 fogIt(vec3 c){ return mix(c, uFogColor, smoothstep(uFogNear, uFogFar, length(vW - cameraPosition))); }`;
  const VS = `varying vec3 vW; void main(){ vec4 w = modelMatrix*vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }`;
  const flatMat = (col, alpha) => new THREE.ShaderMaterial({
    uniforms: Object.assign({uCol:{value:new THREE.Color(col)}, uSea:{value:new THREE.Color(0x0F272A)}, uBg:{value:new THREE.Color(0x0C1915)}}, {uFogColor:uni.uFogColor, uFogNear:uni.uFogNear, uFogFar:uni.uFogFar}),
    vertexShader: VS,
    fragmentShader: `uniform vec3 uCol; uniform vec3 uSea; uniform vec3 uBg; ${FADE}

    transparent: !!alpha, depthWrite: !alpha

  const sea = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), flatMat(0x0F272A));
  sea.rotation.x = -Math.PI/2; sea.position.y = -0.02; scene.add(sea);
  const landMat = flatMat(0x1A2F26);
  const coastMat = flatMat(0xE9E0CC, 0.16);
  T.neighbors.forEach(nb => nb.polys.forEach(rings => {

    scene.add(new THREE.Line(lg, coastMat));
  }));

  /* ---- batas kecamatan ---- */
  const bp = [];
  T.borders.forEach(line => {
    for (let q = 0; q < line.length-1; q++) {
      const a = line[q], b = line[q+1];
      bp.push(toX(a[0]), hToY(hAt(a[0], a[1])) + 0.05, toZ(a[1]), toX(b[0]), hToY(hAt(b[0], b[1])) + 0.05, toZ(b[1]));
    }
  });
  const bg = new THREE.BufferGeometry(); bg.setAttribute('position', new THREE.Float32BufferAttribute(bp, 3));
  borderLines = new THREE.LineSegments(bg, new THREE.LineBasicMaterial({color:0xF4EBD8, transparent:true, opacity:0}));
  scene.add(borderLines);

  /* ---- tiang penanda ---- */
  const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(DEST.length*6), 3));
  stems = new THREE.LineSegments(sg, new THREE.LineBasicMaterial({color:0xECE4D2, transparent:true, opacity:0}));
  scene.add(stems);
  routeGroup = new THREE.Group(); scene.add(routeGroup);
}

/* posisi 3D tiap tempat */
const STEM = 0.95;

/* ============== kamera & kontrol ============== */
const compassSvg = $('#compass svg');
const ctl = {t:{x:0,y:1,z:0}, th:0, ph:0.9, r:100, g:{t:{x:0,y:1,z:0}, th:0, ph:0.9, r:100}};
const LIM = {phMin:0.12, phMax:1.36, rMin:6, rMax:230};
function homeView(){
  if (isMobile) { const avail = Math.max(260, innerHeight - 64 - 212 - 102); return {t:{x:0.3, y:1.4, z:1.5}, th:0.0, ph:0.66, r:clamp(58*innerHeight/(0.573*avail), 120, 230)}; }
  const avail = Math.max(420, innerWidth - 412);
  return {t:{x:0.5, y:1.4, z:0.5}, th:1.0, ph:0.94, r:clamp(64*innerHeight/(0.43*avail), 80, 200)};
}
function setGoal(v, instant){
  const g = ctl.g;
  if (v.t) g.t = {x:v.t.x, y:v.t.y, z:v.t.z};

const tourEnded = () => !!tour && tour.beats[tour.i].type === 'end';
function syncPlay(){
  playBtn.innerHTML = !tour ? `${icon('play')}<span>Pandu tour</span>` : tourEnded() ? `${icon('replay')}<span>Ulangi</span>` : tour.paused ? `${icon('play')}<span>Lanjut</span>` : `${icon('pause')}<span>Jeda</span>`;

  if (!tour || tour.paused === p) return;
  tour.paused = p; syncPlay();
  if (p) { NARATOR.pause(); return; }
  /* klip bisa tergantikan narasi lain (misalnya tampilan GWK): putar ulang dari awal */

function startTour(){

function tourStep(dt){
  if (tourGroup) tourGroup.children.forEach(m => { if (m.userData.grow < 1) { m.userData.grow = Math.min(1, m.userData.grow + dt/1.4); setGrow(m); } });
  if (tour.paused) return;
  const b = tour.beats[tour.i], dur = beatDur(b);
  if (!reduceMotion && b.type !== 'end') ctl.g.th += dt*0.028*tour.dir;   /* kamera berputar pelan */
  tour.t += dt;
  /* dengan narator, langkah berikutnya menunggu narasi selesai; tanpa narator pakai timer */
  let prog, next;
  if (tour.voice === 'play' || tour.voice === 'done') {
    prog = tour.voice === 'done' ? 1 : (NARATOR.progress() || 0);
    next = tour.voice === 'done' && tour.t >= Math.max(3.5, tour.spoke + 1.1);
  } else {
    prog = dur === Infinity ? 1 : tour.t/dur;
    next = tour.t >= dur;
  }
  const bar = $('#trbar'); if (bar) bar.style.width = (Math.min(1, prog)*100).toFixed(1) + '%';

tourCard.addEventListener('click', e => {

/* ============== filter ============== */
function matches(d){
  if (state.kec !== null && d.kec !== state.kec) return false;
  if (state.cats.size && !state.cats.has(d.cat)) return false;
  if (state.q) { const q = state.q.toLowerCase(); if (!(d.name.toLowerCase().includes(q) || KEC[d.kec].name.toLowerCase().includes(q))) return false; }
  return true;
}
function computeVisible(){
  if (tour) { visibleIds = new Set(tour.shown); return; }   /* cerita: hanya titik yang sudah dikunjungi */
  let ids;
  if (state.tab === 'jelajah') ids = DEST.filter(matches).map(d => d.id);
  else if (state.tab === 'koleksi' && state.coll) ids = COLL.find(c => c.id === state.coll).ids;
  else ids = DEST.map(d => d.id);
  visibleIds = new Set(ids);
  if (state.sel) visibleIds.add(state.sel);
}
function updateMarkers(){
  computeVisible();
  const planIdx = Object.fromEntries(state.plan.map((s, i) => [s.id, i + 1]));
  DEST.forEach(d => {
    const el = MK[d.id];
    el.classList.toggle('sel', d.id === state.sel || (!!tour && d.id === tour.cur));
    const inPlan = !!planIdx[d.id] && (state.tab === 'rencana');
    el.classList.toggle('inplan', inPlan);
    el.querySelector('.mk-n').textContent = planIdx[d.id] || '';
    let dim = false;
    if (state.tab === 'rencana' && state.plan.length) dim = !planIdx[d.id];
    el.classList.toggle('dim', dim && d.id !== state.sel);
  });
  updateStems();
  needs = true;
}


/* render ulang isi panel tanpa kehilangan fokus keyboard */

/* ============== panel: rencana ============== */
const DUR_DEF = {pantai:90, budaya:60, alam:90, rekreasi:150};
const DUR_OPT = [30, 45, 60, 90, 120, 150, 180, 240];
const MAX_STOPS = 8;
function hav(a, b){ const R = 6371, dLat = (b.lat-a.lat)*Math.PI/180, dLon = (b.lon-a.lon)*Math.PI/180; const s = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(s)); }
function travel(a, b){
  const km = hav(a, b)*1.35;
  const busy = k => k <= 2;
  const v = busy(a.kec) && busy(b.kec) ? 18 : (busy(a.kec) || busy(b.kec)) ? 24 : 30;
  return {km, min:Math.max(5, Math.round(km/v*60/5)*5)};
}
function planTimes(){
  const [hh, mm] = state.start.split(':').map(Number);
  let t = (hh||8)*60 + (mm||0), drive = 0; const out = [];
  state.plan.forEach((s, i) => {
    let leg = null;
    if (i > 0) { leg = travel(BY[state.plan[i-1].id], BY[s.id]); t += leg.min; drive += leg.min; }
    out.push({arr:t, dep:t + s.dur, leg}); t += s.dur;
  });
  return {stops:out, end:t, drive};
}

        <button class="ibtn" data-down="${i}" ${i === n-1 ? 'disabled' : ''} aria-label="Turunkan ${esc(d.name)}">${icon('down')}</button>

  s += `<div class="row-actions">${n > 2 ? `<button class="btn btn-ghost" data-opt>${icon('sort')}Urutkan rute terdekat</button>` : ''}<button class="btn btn-ghost" data-clear>${icon('trash')}Kosongkan</button></div>`;
  s += recBlock();
  s += `<p class="note">Estimasi waktu tempuh dihitung kasar dari jarak dan kepadatan lalu lintas tiap kecamatan. Kawasan Kuta, Kuta Utara, dan Kuta Selatan dihitung lebih lambat karena sering macet.</p>`;

function optimizePlan(){
  const rest = state.plan.slice(1), out = [state.plan[0]];
  while (rest.length) {
    const cur = BY[out[out.length-1].id]; let bi = 0, bd = 1e9;
    rest.forEach((s, i) => { const d = hav(cur, BY[s.id]); if (d < bd) { bd = d; bi = i; } });
    out.push(rest.splice(bi, 1)[0]);
  }
  const si = out.findIndex(s => BY[s.id].sunset);
  if (si >= 0 && si !== out.length - 1 && out.filter(s => BY[s.id].sunset).length === 1) out.push(out.splice(si, 1)[0]);

const T_REVEAL = 1250, T_INFO = 2100;
function enterTransition(k, fromEl){
  if (reduceMotion || !fromEl) return 0;
  const r = fromEl.getBoundingClientRect(), c = KEC[k], ph = kecPhoto(k);
  const el = document.createElement('div');

  Object.assign(el.style, {left:r.left + 'px', top:r.top + 'px', width:r.width + 'px', height:r.height + 'px'});
  $('#app').appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('full')));
  setTimeout(() => el.classList.add('out'), T_REVEAL);

/* Keluaran audio yang lama diam (terutama headset Bluetooth) baru aktif sepersekian detik
   setelah suara pertama, sehingga awal kalimat bisa terpotong. Hening sebentar lewat Web Audio
   membangunkannya lebih dulu. */
function wakeAudio(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    const c = new AC(), s = c.createBufferSource();
    s.buffer = c.createBuffer(1, Math.round(c.sampleRate*1.5), c.sampleRate);
    s.connect(c.destination); s.onended = () => c.close(); s.start();
  } catch (e) {}
}
/* tombol play adalah izin suara dari pengunjung: nyalakan narator bila sebelumnya dimatikan.
   Musik latar langsung masuk perlahan; salam menyusul setelah jeda singkat (saat pilihan
   muncul) dengan fade in, lalu musik berlanjut tanpa putus ke tour atau explore. */
$('#wl-play').addEventListener('click', e => {
  if (NARATOR.isMuted()) NARATOR.setMuted(false);
  wakeAudio(); MUSIK.mode('welcome');
  welcome.classList.add('go');
  clearTimeout(wlT);
  /* "Om Swastiastu" ada di detik 0,51–1,26 audio/narasi/welcome.mp3, jeda sampai 1,47:
     diputar 0,72× agar tidak terburu-buru (ukur ulang bila klip dibuat ulang) */
  wlT = setTimeout(() => { if (!welcome.hidden) NARATOR.play('welcome', null, {fade:0.2, intro:{until:1.36, rate:0.72}}); }, reduceMotion ? 300 : 900);
  if (e.detail === 0) welcome.querySelector('.wl-opt').focus({preventScroll:true});   /* hanya bila lewat keyboard */
});
welcome.addEventListener('click', e => {
  const b = e.target.closest('[data-wl]');
  if (b) { if (b.dataset.wl === 'tour') { closeWelcome(); startTour(); } else chooseExplore(); }
});

/* ============== tab & search ============== */
const TABS = ['jelajah','koleksi','rencana'];
function setTab(t){
  state.tab = t;
  TABS.forEach(x => {
    const on = x === t; const tb = $('#t-' + x);
    tb.setAttribute('aria-selected', on); tb.tabIndex = on ? 0 : -1;
    $('#p-' + x).hidden = !on;
  });
  if (t === 'jelajah') renderJelajah();
  if (t === 'koleksi') renderKoleksi();
  if (t === 'rencana') renderRencana();
  updateMarkers(); updateHighlight(); updateRoute();
  if (t === 'rencana' && state.plan.length > 1) flyBounds(boundsOf(state.plan.map(p => BY[p.id])));
}
TABS.forEach((t, i) => {
  const b = $('#t-' + t);
  b.addEventListener('click', () => { setTab(t); if (isMobile) setSheet(true); });
  b.addEventListener('keydown', e => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const n = TABS[(i + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length];
    setTab(n); $('#t-' + n).focus();
  });
});
const qIn = $('#q');
qIn.addEventListener('input', () => {
  state.q = qIn.value.trim(); $('#qclear').hidden = !state.q;
  if (state.tab !== 'jelajah') setTab('jelajah'); else { renderJelajah(); updateMarkers(); }
});
qIn.addEventListener('focus', () => { if (isMobile) setSheet(true); });
qIn.addEventListener('keydown', e => { if (e.key === 'Enter') { const f = DEST.find(matches); if (f) { selectPlace(f.id); qIn.blur(); } } });
$('#qclear').addEventListener('click', () => { qIn.value = ''; state.q = ''; $('#qclear').hidden = true; renderJelajah(); updateMarkers(); qIn.focus(); });

/* ============== bottom sheet (mobile) ============== */
const panel = $('#panel'), handle = $('#handle');
function setSheet(open){
  panel.classList.toggle('expanded', open);
  handle.setAttribute('aria-expanded', open);
  handle.setAttribute('aria-label', open ? 'Perkecil panel' : 'Perbesar panel');
  setTimeout(updateViewOffset, 320);
}
let hy = null;
handle.addEventListener('pointerdown', e => { hy = e.clientY; handle.setPointerCapture(e.pointerId); });
handle.addEventListener('pointerup', e => {
  if (hy === null) return; const dy = e.clientY - hy; hy = null;
  if (dy < -18) setSheet(true); else if (dy > 18) setSheet(false); else setSheet(!panel.classList.contains('expanded'));
});

/* ============== kontrol peta ============== */
$('#zin').addEventListener('click', () => { stopOrbit(); zoomBy(0.7); });
$('#zout').addEventListener('click', () => { stopOrbit(); zoomBy(1.42); });
$('#home').addEventListener('click', () => { stopOrbit(); stopTour(); closeKecPop(); closeKecInfo(); if (state.kec !== null) selectKec(null); else flyHome(); });
$('#compass').addEventListener('click', () => { stopOrbit(); setGoal({th:0}); });
const musikBtn = $('#musik');
function syncMusik(){
  const on = MUSIK.isOn();
  musikBtn.innerHTML = icon(on ? 'music' : 'musicoff');
  musikBtn.setAttribute('aria-pressed', on);
  musikBtn.title = on ? 'Matikan musik latar' : 'Nyalakan musik latar';
  musikBtn.classList.toggle('off', !on);
}
musikBtn.addEventListener('click', () => { MUSIK.setOn(!MUSIK.isOn()); toast(MUSIK.isOn() ? 'Musik latar dinyalakan' : 'Musik latar dimatikan'); });
MUSIK.onChange(syncMusik); syncMusik();
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!welcome.hidden) chooseExplore();
  else if (tour) stopTour();
  else if (infoK !== null) closeKecInfo();
  else if (popK !== null) closeKecPop();
  else if (state.sel) closeDetail();
});

let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }

/* ============== start ============== */
function resize(){
  isMobile = mqMobile.matches;
  if (has3D) { renderer.setSize(innerWidth, innerHeight, false); updateViewOffset(); }
}
renderJelajah(); updateBadge();
if (has3D) {
  buildScene();
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('wheel', e => { e.preventDefault(); tourPause(true); stopOrbit(); zoomBy(Math.exp(e.deltaY*0.0012)); }, {passive:false});
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  resize();
  setGoal(homeView(), true);
  if (!reduceMotion) { ctl.r *= 1.25; ctl.th -= 0.35; }
  updateMarkers(); updateRoute();
  canvas.classList.add('ready');
  requestAnimationFrame(frame);
  if (reduceMotion) fadeInExtras();
} else { resize(); }
addEventListener('resize', resize);
mqMobile.addEventListener && mqMobile.addEventListener('change', () => { resize(); if (has3D) flyHome(); });
})();
</script>
</body>
</html>
