<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C1915">
<title>Terra Explorer: Badung</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9B%B0%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@500;600&family=Allura&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Terra Explorer: Badung
   Palet diambil dari material Bali: hutan, batu paras, bata
   merah candi, dan prada (emas) untuk cap passport.
   ========================================================= */
*{box-sizing:border-box}
:root{
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --bg:#0C1915;
  --panel:rgba(15,30,25,.86);
  --panel-solid:#11231D;
  --line:rgba(233,224,204,.10);
  --line2:rgba(233,224,204,.18);
  --text:#ECE4D2;          /* paras */
  --muted:#A6B1A2;
  --faint:#8E9C90;         /* ≥ 4,5:1 di atas panel (#11231D) */
  --accent:#D0703F;        /* bata merah */
  --accent-ink:#1A100A;
  --gold:#D8B066;          /* prada */
  --sheet-h:212px;
  --pf-h:76px;             /* tinggi bar kecamatan di bawah */
  color-scheme:dark;
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* permukaan bawaan browser ikut palet */
:root{accent-color:var(--gold)}
::selection{background:rgba(216,176,102,.38);color:#FFF8EA}
input{caret-color:var(--gold)}
h1,h2,h3{text-wrap:balance}
p{text-wrap:pretty}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{position:fixed;inset:0;background:radial-gradient(120% 90% at 62% 30%,#183128 0%,#0F1F19 52%,#0A1411 100%)}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;opacity:0;transition:opacity .6s}
#scene.ready{opacity:1}
#overlay,#markers{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fallback{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
.fallback[hidden]{display:none}

/* panel mengambang di atas peta 3D yang bergerak: blur menjaga teks terbaca di atas relief,
   tepi didefinisikan garis tipis saja (bayangan lebar tak terlihat di latar gelap) */
.glass{background:var(--panel);-webkit-backdrop-filter:blur(18px) saturate(125%);backdrop-filter:blur(18px) saturate(125%);border:1px solid var(--line)}

/* ---------- panel ---------- */
#panel{position:absolute;z-index:5;top:calc(16px + env(safe-area-inset-top));left:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:364px;border-radius:22px;display:flex;flex-direction:column;overflow:hidden}
.handle{display:none}
.p-head{padding:20px 20px 14px}
.brand{display:flex;align-items:baseline;gap:9px;margin:0;font-size:inherit;font-weight:inherit}
.brand b{font-size:20px;font-weight:800;letter-spacing:-.025em}
.brand span{color:var(--muted);font-weight:500;font-size:14px}
.search{position:relative;margin-top:14px}
.search input{width:100%;height:42px;border-radius:12px;border:1px solid var(--line2);background:rgba(6,14,12,.45);padding:0 36px 0 40px;outline:none;transition:border-color .15s}
.search input::placeholder{color:var(--faint)}
.search input:focus{border-color:rgba(216,176,102,.7)}
.search>svg{position:absolute;left:13px;top:12px;color:var(--muted)}
.search .clear{position:absolute;right:6px;top:6px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.search .clear[hidden]{display:none}
.tabs{display:flex;padding:0 12px;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:12px 2px 11px;color:var(--muted);font-weight:600;font-size:13.5px;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;justify-content:center;align-items:center;gap:6px;transition:color .15s}
.tab:hover{color:var(--text)}
.tab[aria-selected=true]{color:var(--text);border-color:var(--accent)}
.tab .badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;display:inline-grid;place-items:center}
.tab .badge[hidden]{display:none}
.pane{flex:1;overflow:auto;padding:18px 20px 28px;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(233,224,204,.18) transparent}
.pane[hidden]{display:none}
.sec{font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 9px}
.sec+.chips{margin-bottom:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:rgba(233,224,204,.34)}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip svg.i{width:15px;height:15px}
.chip[aria-pressed=true]{background:var(--text);border-color:var(--text);color:#13221C}

.kstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 0;padding:0}
.kstats div{margin:0}
.kstats dt{font-size:12px;color:var(--faint)}
.kstats dd{margin:1px 0 0;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}

.rhead{display:flex;justify-content:space-between;align-items:baseline;margin:4px 0 6px}
.rhead .sec{margin:0}
.linkbtn{color:var(--gold);font-weight:600;font-size:12.5px}
.linkbtn:hover{text-decoration:underline}
.plist{list-style:none;margin:0 -8px;padding:0}
.pitem{display:flex;align-items:center;gap:12px;width:100%;padding:8px;border-radius:12px;text-align:left;transition:background .12s}
.pitem:hover{background:rgba(233,224,204,.05)}
.pitem[aria-current=true]{background:rgba(233,224,204,.10)}
.pic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(6,14,12,.55);box-shadow:inset 0 0 0 1.5px var(--c);color:var(--c)}
.pic svg.i{width:16px;height:16px}
.ptext{min-width:0;flex:1}
.pname{display:block;font-weight:600;font-size:14px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmeta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-top:1px}
.pmeta svg.i{width:13px;height:13px;color:var(--gold)}
.empty{color:var(--muted);font-size:13.5px;padding:10px 0}
.note{margin:22px 0 0;font-size:12px;line-height:1.5;color:var(--faint)}

/* koleksi */
.colls{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.coll{width:100%;text-align:left;padding:14px 14px 13px;border-radius:14px;border:1px solid var(--line);background:rgba(233,224,204,.03);transition:border-color .15s,background .15s}
.coll:hover{border-color:var(--line2)}
.coll[aria-expanded=true]{background:rgba(233,224,204,.07);border-color:rgba(216,176,102,.45)}
.coll h3{margin:0;font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.coll p{margin:3px 0 10px;color:var(--muted);font-size:13px}
.kbar{display:flex;height:4px;border-radius:2px;overflow:hidden;gap:2px}
.kbar i{flex:1;background:var(--c)}
.coll-meta{margin-top:8px;font-size:12px;color:var(--faint)}
.coll-list{margin:6px -8px 4px}

/* rencana */
.plan-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.plan-top h2{margin:0;font-size:17px;font-weight:700}
.start{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.start input{height:34px;border-radius:10px;border:1px solid var(--line2);background:rgba(6,14,12,.45);padding:0 8px;color-scheme:dark}
.plan{list-style:none;margin:0;padding:0}
.stop{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:10px 0}
.snum{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--accent);color:var(--accent-ink)}
.sname{font-weight:600;line-height:1.3;text-align:left}
.sname:hover{text-decoration:underline}
.stime{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.stime select{height:26px;border-radius:7px;border:1px solid var(--line2);background:rgba(6,14,12,.5);font-size:12px;padding:0 4px;color-scheme:dark}
.sctl{display:flex;gap:2px}
.ibtn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.ibtn:hover{background:rgba(233,224,204,.07);color:var(--text)}
.ibtn:disabled{opacity:.3;cursor:default;background:none}
.ibtn svg.i{width:16px;height:16px}
.leg{padding:0 0 0 13px;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.leg span{display:block;border-left:2px dotted rgba(208,112,63,.6);padding:4px 0 4px 22px}
.summary{margin:14px 0 0;padding:12px 14px;border-radius:12px;background:rgba(233,224,204,.05);font-size:13px}
.summary strong{font-weight:700}
.hint{margin:10px 0 0;padding:10px 12px;border-radius:12px;border:1px solid rgba(216,176,102,.35);font-size:12.5px;color:var(--text);display:flex;gap:10px;align-items:flex-start}
.hint svg.i{color:var(--gold);width:16px;height:16px;margin-top:1px}
.hint button{color:var(--gold);font-weight:600;margin-top:4px;display:block}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{height:40px;padding:0 16px;border-radius:12px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s,background .15s}
.btn svg.i{width:16px;height:16px}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{border:1px solid var(--line2)}
.btn-ghost:hover{background:rgba(233,224,204,.06)}
.btn-done{background:rgba(216,176,102,.16);color:var(--gold);border:1px solid rgba(216,176,102,.45)}

/* jelajah: kategori */
.tab svg.star{width:14px;height:14px;color:var(--gold);fill:rgba(216,176,102,.25)}
.kfilter{display:flex;align-items:center;gap:8px;margin:0 0 14px;padding:8px 8px 8px 12px;border-radius:12px;background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);font-size:13px}
.kfilter i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.kfilter b{flex:1;font-weight:700}
.kfilter button{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.kfilter button:hover{background:rgba(233,224,204,.08);color:var(--text)}
.kfilter svg.i{width:15px;height:15px}
/* kotak kategori menempel di atas panel, jadi keempat kategori tetap terlihat saat daftar tempat di-scroll */
.cathead{--px:20px;--pt:18px;position:sticky;top:calc(-1*var(--pt));z-index:2;margin:calc(-1*var(--pt)) calc(-1*var(--px)) 0;padding:var(--pt) var(--px) 14px;background:linear-gradient(180deg,var(--panel-solid) calc(100% - 14px),transparent)}
.cats{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat{width:100%;height:100%;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;column-gap:9px;padding:12px 10px;border-radius:14px;border:1px solid var(--line);background:rgba(233,224,204,.03);text-align:left;transition:background .15s,border-color .15s,opacity .15s,padding .2s}
.cat:hover:not(:disabled){border-color:var(--line2);background:rgba(233,224,204,.06)}
.cat[aria-pressed=true]{border-color:rgba(216,176,102,.6);background:rgba(216,176,102,.13)}
.cat:disabled{opacity:.4;cursor:default}
.cat .ci{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:rgba(6,14,12,.5);color:var(--gold);transition:background .15s,color .15s}
.cat[aria-pressed=true] .ci{background:var(--gold);color:var(--accent-ink)}
.cat .ci svg.i{width:17px;height:17px}
.cat b{display:block;font-size:13px;line-height:1.25;font-weight:700}
.cat small{display:block;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cat em{grid-column:1/-1;margin-top:9px;font-style:normal;font-size:12px;line-height:1.4;color:var(--faint)}
.cathead.picked .cat{padding:9px 8px}
.cathead.picked .cat em{display:none}
.cat-hint{margin:2px 0 0;font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.cat-hint svg.i{width:15px;height:15px;color:var(--gold);flex:none}
/* rencana: rekomendasi */
.rek{list-style:none;margin:6px -8px 0;padding:0}
.rek li{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px}
.rek li:hover{background:rgba(233,224,204,.04)}
.rek .rn{width:22px;font-size:12px;font-weight:800;color:var(--faint);text-align:center;flex:none;font-variant-numeric:tabular-nums}
.rek .rt{flex:1;min-width:0;text-align:left}
.rek .rt b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rek .rt small{display:block;font-size:12px;color:var(--muted)}
.rek .radd{height:30px;padding:0 10px;border-radius:9px;border:1px solid var(--line2);display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;flex:none}
.rek .radd:hover{background:rgba(233,224,204,.07)}
.rek .radd svg.i{width:14px;height:14px}
.rek .radd.on{border-color:rgba(216,176,102,.5);color:var(--gold);background:rgba(216,176,102,.1)}

/* ---------- markers & labels ---------- */
.mk{position:absolute;left:0;top:0;pointer-events:auto;will-change:transform}
.mk[hidden]{display:none}
.mk-b{position:absolute;left:-15px;top:-15px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#10201B;color:var(--c);box-shadow:inset 0 0 0 2px var(--c),0 4px 14px rgba(0,0,0,.5);transition:transform .18s,opacity .2s,background .18s,color .18s}
.mk-b svg.i{width:15px;height:15px}
.mk:hover .mk-b{transform:scale(1.12)}
.mk.dim .mk-b{opacity:.32}
.mk.sel .mk-b{background:var(--c);color:#10201B;transform:scale(1.28);box-shadow:0 0 0 4px rgba(16,32,27,.85),0 6px 18px rgba(0,0,0,.55)}
.mk.inplan .mk-b{background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 0 0 2px var(--accent),0 4px 14px rgba(0,0,0,.5)}
.mk-n{font-weight:800;font-size:13px;display:none}
.mk.inplan .mk-n{display:block}
.mk.inplan .mk-b svg{display:none}
.mk-l{position:absolute;left:0;bottom:22px;transform:translateX(-50%);white-space:nowrap;padding:4px 9px;border-radius:8px;background:rgba(12,25,21,.92);border:1px solid var(--line);font-size:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .15s}
.mk.lbl .mk-l,.mk:hover .mk-l,.mk.sel .mk-l{opacity:1}
.mk.sel{z-index:3}
#markers.far .mk:not(.sel):not(.inplan) .mk-b{transform:scale(.42);background:var(--c);box-shadow:0 0 0 2px rgba(12,25,21,.85),0 2px 8px rgba(0,0,0,.5)}
#markers.far .mk:not(.sel):not(.inplan) .mk-b svg{opacity:0}
#markers.far .mk:not(.sel):not(.inplan):hover .mk-b{transform:scale(.9)}
#markers.far .mk:not(.sel):not(.inplan):hover .mk-b svg{opacity:1}
.mk:hover{z-index:4}
.mk:focus-visible{outline:none}
.mk:focus-visible .mk-b{outline:2px solid var(--gold);outline-offset:3px}
.olbl{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform;transition:opacity .25s}
.klbl{font-weight:800;font-size:15px;letter-spacing:-.01em;color:#F3ECDC;text-shadow:0 1px 2px rgba(0,0,0,.6),0 0 18px rgba(0,0,0,.55)}
.klbl.on{color:#fff}
.nlbl{font-weight:600;font-size:12px;color:rgba(233,224,204,.42);letter-spacing:.04em}
.slbl{font-weight:500;font-style:italic;font-size:12.5px;color:rgba(160,200,200,.40);letter-spacing:.06em}

/* ---------- bar kecamatan ---------- */
#kecbar{position:absolute;z-index:4;left:396px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));height:var(--pf-h);border-radius:18px;padding:8px;display:flex;gap:8px;transition:transform .45s cubic-bezier(.3,.7,.2,1),opacity .3s}
body.exploring #kecbar{transform:translateY(calc(100% + 28px));opacity:0;pointer-events:none}
#kecbar.nudge{animation:nudge 1.2s ease-in-out 2}
@keyframes nudge{0%,100%{box-shadow:0 24px 60px -28px rgba(0,0,0,.75)}50%{box-shadow:0 0 0 3px rgba(216,176,102,.6),0 24px 60px -28px rgba(0,0,0,.75)}}
.kb-tour{flex:none;display:flex;align-items:center;gap:8px;padding:0 16px 0 13px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:13.5px;white-space:nowrap;transition:filter .15s}
.kb-tour:hover{filter:brightness(1.08)}
.kb-tour svg.i{width:17px;height:17px}
.kb-list{flex:1;min-width:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.kb{display:flex;align-items:center;gap:8px;min-width:0;padding:0 10px 0 8px;border-radius:12px;text-align:left;border:1px solid var(--line);background:rgba(233,224,204,.03);transition:background .15s,border-color .15s}
.kb:hover{background:rgba(233,224,204,.07);border-color:var(--line2)}
.kb[aria-pressed=true],.kb.cur{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.kb.cur{box-shadow:0 0 0 2px var(--c)}
.kb.tap{animation:kbTap .38s cubic-bezier(.16,1,.3,1)}
@keyframes kbTap{0%{transform:scale(1)}35%{transform:scale(.93)}100%{transform:scale(1)}}
.kb.tap svg.kmo{animation:kbIco .5s cubic-bezier(.16,1,.3,1)}
@keyframes kbIco{0%{transform:scale(1) rotate(0)}40%{transform:scale(1.12) rotate(-5deg)}100%{transform:scale(1) rotate(0)}}
/* transisi memasuki kecamatan */
.kt{position:fixed;z-index:25;overflow:hidden;border-radius:18px;pointer-events:none;background:color-mix(in srgb,var(--c) 35%,#0E1D18);transition:left .8s cubic-bezier(.75,0,.2,1),top .8s cubic-bezier(.75,0,.2,1),width .8s cubic-bezier(.75,0,.2,1),height .8s cubic-bezier(.75,0,.2,1),border-radius .8s,opacity .7s ease,transform .8s ease,filter .7s ease}
.kt.full{left:0!important;top:0!important;width:100vw!important;height:100vh!important;border-radius:0}
.kt.out{opacity:0;transform:scale(1.08);filter:blur(8px)}
.kt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.2);transition:transform 2s cubic-bezier(.2,.7,.2,1)}
.kt.full img{transform:scale(1.02)}
.kt svg.kmo{position:absolute;left:50%;top:38%;width:30vmin;height:30vmin;margin:-15vmin 0 0 -15vmin;color:var(--c);opacity:.85}
.kt::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 30%,transparent 30%,rgba(8,16,13,.55)),linear-gradient(180deg,rgba(10,20,17,.1) 35%,rgba(10,20,17,.85))}
.kt-txt{position:absolute;z-index:1;left:0;right:0;bottom:15vh;padding:0 24px;text-align:center;opacity:0;transform:translateY(24px);transition:opacity .5s .4s,transform .7s .4s cubic-bezier(.2,.7,.2,1)}
.kt.full .kt-txt{opacity:1;transform:none}
.kt-txt h2{margin:0;font-size:clamp(36px,7vw,68px);font-weight:800;letter-spacing:-.03em;line-height:1.05;text-shadow:0 4px 24px rgba(0,0,0,.45)}
.kt-line{display:block;width:0;height:3px;margin:16px auto 0;border-radius:2px;background:var(--c);transition:width .8s .55s cubic-bezier(.2,.7,.2,1)}
.kt.full .kt-line{width:90px}
.kt-txt p{max-width:540px;margin:14px auto 0;font-size:15.5px;line-height:1.55;color:#ECE4D2;text-shadow:0 1px 8px rgba(0,0,0,.6)}
svg.kmo{fill:none;stroke:currentColor;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.kb svg.kmo{width:32px;height:32px;flex:none;color:var(--c)}
.kb span{min-width:0}
.kb b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;font-weight:700;line-height:1.2}
.kb small{display:block;font-size:12px;color:var(--muted);white-space:nowrap}
/* kartu pratinjau di atas bar */
#kecpop{position:absolute;z-index:6;left:var(--px,50%);bottom:calc(var(--pf-h) + 28px + env(safe-area-inset-bottom));width:320px;margin-left:-160px;border-radius:18px;transform-origin:var(--nx,50%) 100%}
#kecpop[hidden]{display:none}
#kecpop.swap{animation:popUp .42s cubic-bezier(.16,1,.3,1)}
#kecpop::after{content:"";position:absolute;bottom:-7px;left:var(--nx,50%);width:14px;height:14px;margin-left:-7px;transform:rotate(45deg);background:var(--panel-solid);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
@keyframes popUp{from{opacity:0;transform:translateY(14px) scale(.94)}}
#kecpop.swap .kp-hero img,#kecpop.swap .kp-hero svg.kmo{animation:kpZoom .9s cubic-bezier(.2,.7,.2,1)}
@keyframes kpZoom{from{transform:scale(1.25);opacity:.4}}
#kecpop.swap .kp-body>*{animation:trIn .4s cubic-bezier(.2,.7,.2,1) both}
#kecpop.swap .kp-body>:nth-child(2){animation-delay:.06s}
#kecpop.swap .kp-body>:nth-child(3){animation-delay:.12s}
#kecpop.swap .kp-body>:nth-child(4){animation-delay:.18s}
.kp-go{display:block;width:100%;text-align:left;border-radius:18px;overflow:hidden}
.kp-hero{position:relative;height:112px;overflow:hidden;background:color-mix(in srgb,var(--c) 32%,#0E1D18)}
.kp-hero img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.kp-go:hover .kp-hero img{transform:scale(1.05)}
.kp-hero svg.kmo{position:absolute;left:50%;top:50%;width:90px;height:90px;margin:-45px 0 0 -45px;color:var(--c);opacity:.9}
.kp-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(10,20,17,.55))}
.kp-body{padding:12px 14px 14px}
.kp-body h3{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em}
.kp-body p{margin:4px 0 0;font-size:12.5px;line-height:1.5;color:var(--muted)}
.kp-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.kp-meta span{height:24px;padding:0 9px;border-radius:7px;display:inline-flex;align-items:center;background:rgba(233,224,204,.07);font-size:12px;font-weight:600}
.kp-cta{display:flex;align-items:center;gap:6px;margin-top:12px;font-weight:700;font-size:13.5px;color:var(--gold)}
.kp-cta svg.i{width:16px;height:16px;transition:transform .2s}
.kp-go:hover .kp-cta svg.i{transform:translateX(3px)}
.kp-x{position:absolute;z-index:1;top:8px;right:8px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(10,20,17,.6)}
.kp-x svg.i{width:16px;height:16px}
/* kartu besar penjelasan kecamatan */
#kecinfo{position:absolute;z-index:7;top:calc(16px + env(safe-area-inset-top));right:72px;width:420px;max-height:calc(100% - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom));border-radius:24px;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(233,224,204,.18) transparent;animation:bigIn .5s cubic-bezier(.16,1,.3,1)}
#kecinfo[hidden]{display:none}
@keyframes bigIn{from{opacity:0;transform:translateY(16px) scale(.92)}}
/* kartu dirancang muat sekali lihat tanpa scroll: hero pendek, tempat berupa chip ringkas */
.ki-hero{position:relative;height:clamp(118px,19vh,168px);overflow:hidden;background:color-mix(in srgb,var(--c) 32%,#0E1D18)}
.ki-credit{position:absolute;z-index:2;left:14px;top:12px;font-size:11.5px;color:rgba(241,229,201,.75);text-shadow:0 1px 4px rgba(0,0,0,.6)}
.ki-credit:hover{color:#F1E5C9;text-decoration:underline}
.ki-hero img{display:block;width:100%;height:100%;object-fit:cover}
.ki-hero svg.kmo{position:absolute;left:50%;top:44%;width:120px;height:120px;margin:-60px 0 0 -60px;color:var(--c)}
.ki-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,20,17,.1) 30%,rgba(10,20,17,.85))}
.ki-name{position:absolute;z-index:1;left:20px;right:20px;bottom:14px}
.ki-name h2{margin:0;font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.ki-x{position:absolute;z-index:2;top:12px;right:12px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(10,20,17,.6)}
.ki-x:hover{background:rgba(10,20,17,.85)}
.ki-body{padding:14px 20px 18px}
.ki-lead{margin:0;font-size:14.5px;font-weight:600;line-height:1.45}
.ki-story{margin:6px 0 0;font-size:13px;line-height:1.55;color:#D6CEBC}
.ki-body .kstats{margin:12px 0 0;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ki-fit{margin:10px 0 0;font-size:12.5px;line-height:1.5;color:var(--muted)}
.ki-fit b{color:var(--text);font-weight:700;margin-right:4px}
.ki-sechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:14px 0 8px}
.ki-sechead .sec{margin:0}
.ki-places{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ki-places li{min-width:0}
.ki-pl{width:100%;height:32px;padding:0 12px 0 5px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;white-space:nowrap;border:1px solid var(--line2);background:rgba(233,224,204,.04);transition:background .15s,border-color .15s}
.ki-pl:hover{background:rgba(233,224,204,.09);border-color:color-mix(in srgb,var(--c) 65%,transparent)}
.ki-pl span:last-child{overflow:hidden;text-overflow:ellipsis}
.ki-pl-i{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 24%,transparent);color:var(--c)}
.ki-pl-i svg.i{width:13px;height:13px}
.ki-acts{display:flex;gap:8px;margin-top:16px}
/* layar pendek: cerita disembunyikan (ringkasan tetap) supaya kartu tetap muat tanpa scroll */
@media (min-width:900px) and (max-height:700px),(max-width:899px) and (max-height:780px){ .ki-story{display:none} }
.ki-acts .btn{flex:1;padding:0 12px}
.ki-body>*,.ki-name{animation:trIn .5s cubic-bezier(.2,.7,.2,1) both}
.ki-body>:nth-child(2){animation-delay:.08s}.ki-body>:nth-child(3){animation-delay:.16s}.ki-body>:nth-child(4){animation-delay:.24s}.ki-body>:nth-child(n+5){animation-delay:.3s}
.mk.popin .mk-b{animation:mkIn .6s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--dl,0s)}
.mk.popin .mk-l{animation:fadeIn .4s both;animation-delay:calc(var(--dl,0s) + .15s)}
.plist li.li-in{animation:trIn .35s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*25ms)}
@keyframes mkIn{0%{transform:scale(0)}100%{transform:scale(1)}}
/* layar awal */
/* Layar sambutan: panorama gerbang candi bentar, judul serif kapital + huruf sambung (nuansa
   buku perjalanan, selaras dengan cerita budaya Bali), tombol play, lalu dua pilihan mode.
   Huruf antarmuka lain tetap Plus Jakarta Sans. */
#welcome{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;overflow:hidden;background:#0D0B08;color:#F7F0E3;animation:fadeIn .6s}
#welcome[hidden]{display:none}
#welcome.out{opacity:0;transition:opacity .6s}
@keyframes fadeIn{from{opacity:0}}
/* video latar tanpa suara; panorama.jpg jadi poster sampai video siap (dan cadangan bila tak bisa diputar) */
.wl-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;opacity:0;transition:opacity 1.2s}
.wl-bg.ready{opacity:1}
/* bayangan atas dan bawah: gelap di tepi, memudar menjadi terang menuju tengah */
.wl-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,10,8,.82) 0%,rgba(8,10,8,.35) 22%,rgba(8,10,8,0) 44%,rgba(8,10,8,0) 56%,rgba(8,10,8,.35) 78%,rgba(8,10,8,.82) 100%)}
/* sapuan gelap lembut tepat di belakang judul supaya terbaca di atas ukiran gerbang */
.wl-shade::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 42% 22% at 50% 52%,rgba(8,10,8,.42),rgba(8,10,8,0) 100%)}
.wl-main{position:relative;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;text-align:center;padding:32px 24px 48px}
.wl-logo{width:auto;height:clamp(72px,12vh,104px);margin-bottom:22px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45));animation:trIn 1s .1s cubic-bezier(.2,.7,.2,1) both}
.wl-h1{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(28px,min(4.2vw,7.5vh),60px);line-height:1.05;letter-spacing:.02em;text-transform:uppercase;text-shadow:0 1px 3px rgba(0,0,0,.45),0 2px 26px rgba(0,0,0,.55);animation:trIn 1s .3s cubic-bezier(.2,.7,.2,1) both}
.wl-script{margin:-.04em 0 0;font-family:'Allura',cursive;font-weight:400;font-size:clamp(30px,min(3.8vw,7vh),54px);line-height:1.1;color:#F2D8A2;text-shadow:0 1px 3px rgba(0,0,0,.5),0 2px 22px rgba(0,0,0,.6);animation:trIn 1s .5s cubic-bezier(.2,.7,.2,1) both}
/* tombol mulai: kapsul dengan lingkaran play dan tulisan Mulai */
.wl-play{margin-top:30px;height:56px;display:inline-flex;align-items:center;gap:14px;padding:0 30px 0 8px;border-radius:999px;border:1px solid rgba(251,247,238,.6);background:rgba(251,247,238,.12);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#FBF7EE;transition:background .25s,border-color .25s,transform .25s,box-shadow .25s;animation:trIn 1s .7s cubic-bezier(.2,.7,.2,1) both}
.wl-play:hover{background:rgba(251,247,238,.22);border-color:rgba(251,247,238,.9);transform:translateY(-1px)}
.wl-play:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(242,216,162,.7)}
.wl-ring{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#FBF7EE;color:#1E160C;transition:transform .25s}
.wl-play:hover .wl-ring{transform:scale(1.06)}
.wl-ring svg{width:16px;height:16px;margin-left:2px;fill:currentColor}
.wl-play b{font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
/* langkah kedua (setelah play): tombol play berganti dua pilihan mode */
.wl-opts{display:none;grid-template-columns:1fr 1fr;gap:12px;width:min(640px,100%);margin-top:30px}
#welcome.go .wl-play{display:none}
#welcome.go .wl-opts{display:grid}
#welcome.go .wl-opt{animation:trIn .6s cubic-bezier(.2,.7,.2,1) both}
#welcome.go .wl-opt+.wl-opt{animation-delay:.12s}
.wl-opt{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;column-gap:10px;row-gap:8px;align-content:start;padding:18px;border-radius:18px;border:1px solid rgba(247,240,227,.24);background:rgba(16,13,9,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);text-align:left;color:#F7F0E3;transition:transform .18s,border-color .18s,background .18s}
.wl-opt:hover{transform:translateY(-2px);border-color:rgba(247,240,227,.45);background:rgba(16,13,9,.68)}
.wl-opt.primary{border-color:rgba(216,176,102,.6);background:linear-gradient(140deg,rgba(208,112,63,.42),rgba(16,13,9,.6))}
.wl-opt.primary:hover{border-color:rgba(216,176,102,.9)}
@media (max-height:620px){
  .wl-logo{margin-bottom:14px}
  .wl-play,.wl-opts{margin-top:20px}
}
/* ikon sejajar judul pilihan, tanpa kotak; keterangan di bawahnya selebar kartu */
.wl-ico{display:grid;place-items:center;color:var(--gold)}
.wl-ico svg.i{width:22px;height:22px}
.wl-opt b{font-size:17px;font-weight:800;letter-spacing:-.01em}
.wl-opt>span:not(.wl-ico),.wl-opt em{grid-column:1/-1}
.wl-opt>span:not(.wl-ico){font-size:13px;line-height:1.5;color:#DCD4C2}
.wl-opt em{font-style:normal;font-size:12px;font-weight:600;color:#BFC7BC}

/* ---------- map controls ---------- */
#mapctl{position:absolute;z-index:4;top:calc(16px + env(safe-area-inset-top));right:16px;display:flex;flex-direction:column;gap:8px}
.mbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;transition:background .15s}
.mbtn:hover{background:rgba(30,56,46,.92)}
#compass svg{transition:transform .1s linear}
#musik svg.i{width:19px;height:19px}
#musik.off{color:var(--faint)}

/* ---------- detail ---------- */
#detail{position:absolute;z-index:6;top:calc(16px + env(safe-area-inset-top));right:72px;width:368px;max-height:calc(100% - var(--pf-h) - 60px);border-radius:22px;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(233,224,204,.18) transparent}
#detail[hidden]{display:none}
.d-hero{position:relative;height:132px;background:#16291F;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.25)),color-mix(in srgb,var(--kc) 22%,#0E1D18)}
.d-hero svg.sil{position:absolute;left:0;right:0;bottom:0;width:100%;height:96px}
.d-hero.has-photo{height:200px}
.d-hero .d-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.d-credit{margin:6px 0 0;font-size:11.5px;line-height:1.4;color:#9A9383}
.d-credit a{color:inherit}
.d-cat{position:absolute;left:18px;top:16px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--kc);color:#10201B}
.d-cat svg.i{width:20px;height:20px}
.d-elev{position:absolute;left:68px;top:16px;line-height:1.2}
.d-elev b{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.d-elev span{font-size:12px;color:rgba(236,228,210,.75)}
.d-close{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(10,20,17,.55)}
.d-close:hover{background:rgba(10,20,17,.8)}
.d-body{padding:16px 20px 22px}
.d-body h2{margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.d-sub{margin:4px 0 0;color:var(--muted);font-size:13px}
.tags{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0;padding:0}
.tag{height:26px;padding:0 10px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:rgba(233,224,204,.07);color:var(--text)}
.tag svg.i{width:14px;height:14px}
.tag.sun{background:rgba(216,176,102,.15);color:var(--gold)}
.tag.beach{background:rgba(110,170,180,.14);color:#A9D2D6}
.d-desc{margin:14px 0 0;font-size:14px;line-height:1.6;color:#DCD4C2}
.d-block{margin:16px 0 0;padding:12px 14px;border-radius:12px;background:rgba(233,224,204,.045)}
.d-block h3{margin:0 0 6px;font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center}
.d-block h3 svg.i{width:16px;height:16px;color:var(--gold)}
.d-block p,.d-block li{font-size:13px;line-height:1.55;color:#D2CAB8}
.d-block p{margin:0}
.d-block p+p{margin-top:6px}
.d-block ul{margin:0;padding-left:18px}
.d-block li+li{margin-top:4px}
.d-actions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:18px}
.d-actions .btn{padding:0 10px;gap:6px;white-space:nowrap;font-size:13px}
.d-route{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;height:38px;border-radius:12px;font-weight:600;font-size:13px;color:var(--muted);text-decoration:none}
.d-route:hover{color:var(--text);background:rgba(233,224,204,.05)}
.d-route svg.i{width:16px;height:16px}

/* ---------- toast ---------- */
#toast{position:absolute;z-index:9;left:50%;bottom:calc(var(--pf-h) + 40px);transform:translate(-50%,10px);padding:10px 16px;border-radius:12px;background:#ECE4D2;color:#13221C;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

#brandM{display:none}

/* ---------- cerita Telusuri ---------- */
#tour{position:absolute;z-index:6;top:calc(16px + env(safe-area-inset-top));right:72px;width:360px;max-height:calc(100% - var(--pf-h) - 60px);border-radius:22px;overflow:auto;padding:14px 18px 16px;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(233,224,204,.18) transparent}
#tour[hidden]{display:none}
.tr-head{display:flex;align-items:center;gap:10px}
/* konteks bab di baris kontrol kartu cerita (bukan label di atas judul): huruf biasa, warna lembut */
.tr-kick{display:inline-flex;align-items:center;gap:7px;min-width:0;font-size:12.5px;font-weight:600;color:var(--muted)}
.tr-kick i{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c)}
.tr-n{margin-left:auto;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.tr-x{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--muted)}
.tr-x:hover{background:rgba(233,224,204,.07);color:var(--text)}
.tr-x svg.i{width:16px;height:16px}
.tr-x.talking,.gk-vol.talking{color:var(--gold)}
.tr-x.talking svg path:last-child,.gk-vol.talking svg path:last-child{animation:talk 1s ease-in-out infinite}
@keyframes talk{0%,100%{opacity:.25}50%{opacity:1}}
.tr-x[aria-pressed=true]{color:var(--accent)}
.tr-muted{display:flex;align-items:center;gap:8px;margin:-4px 0 12px;padding:8px 10px;border-radius:10px;background:rgba(208,112,63,.14);color:#F0C2A6;font-size:12.5px;font-weight:600}
.tr-muted[hidden]{display:none}
.tr-muted svg.i{width:16px;height:16px;flex:none}
.tr-bar{height:3px;margin:10px 0 14px;border-radius:2px;overflow:hidden;background:rgba(233,224,204,.1)}
.tr-bar i{display:block;width:0;height:100%;background:var(--gold)}
.tr-img{position:relative;height:150px;margin:0 0 12px;border-radius:14px;overflow:hidden;background:rgba(233,224,204,.05)}
.tr-img img{display:block;width:100%;height:100%;object-fit:cover}
.tr-img figcaption{position:absolute;right:8px;bottom:6px;font-size:11.5px;color:rgba(255,255,255,.85);text-shadow:0 1px 3px rgba(0,0,0,.75)}
.tr-title{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.tr-sub{margin:4px 0 0;font-size:13px;color:var(--muted)}
.tr-body>.tr-img,.tr-body>.tr-title,.tr-body>.tr-sub{animation:trIn .45s cubic-bezier(.2,.7,.2,1) both}
.tr-body>.tr-title{animation-delay:.05s}
.tr-body>.tr-sub{animation-delay:.12s}
.tr-pts{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.tr-pts li{position:relative;padding:9px 12px 9px 30px;border-radius:12px;background:rgba(233,224,204,.05);font-size:13.5px;line-height:1.5;color:#DCD4C2;animation:trIn .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.35s + var(--d)*.9s)}
.tr-pts li::before{content:"";position:absolute;left:12px;top:15px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(216,176,102,.2)}
.tr-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;animation:trIn .45s .4s both}
.tr-acts .btn{height:34px;padding:0 12px;font-size:12.5px;gap:6px}
.tr-acts .btn svg.i{width:15px;height:15px}
.tr-ctl{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.tr-ctl .btn{flex:1}
.tr-ctl .ibtn{width:40px;height:40px;border:1px solid var(--line2);border-radius:12px}
@keyframes trIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.mk.pop .mk-b{animation:mkPop .75s cubic-bezier(.16,1,.3,1) both}
.mk.pop .mk-b::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--c);animation:mkRing 1s ease-out both;pointer-events:none}
@keyframes mkPop{0%{transform:scale(0)}100%{transform:scale(1.28)}}
@keyframes mkRing{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.4);opacity:0}}

/* ---------- GWK: penanda khusus & tombol 3D ---------- */
.mk-gwk .mk-b{left:-19px;top:-19px;width:38px;height:38px;background:radial-gradient(circle at 50% 32%,#30705F,#14352E);color:#F1D58F;box-shadow:inset 0 0 0 2px var(--gold),0 0 0 3px rgba(12,25,21,.75),0 6px 18px rgba(0,0,0,.55)}
.mk-gwk .mk-b svg.i{width:23px;height:23px;stroke-width:1.6}
.mk-gwk .mk-b::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid rgba(216,176,102,.7);animation:gwkPulse 2.4s ease-out infinite;pointer-events:none}
@keyframes gwkPulse{0%{transform:scale(.82);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.mk-3d{position:absolute;left:9px;top:-27px;padding:1px 5px;border-radius:6px;background:var(--gold);color:#1A140A;font-size:10px;font-weight:800;letter-spacing:.03em;line-height:15px;box-shadow:0 2px 6px rgba(0,0,0,.45);pointer-events:none}
.mk-gwk .mk-l{bottom:28px}
.mk-gwk.sel .mk-b{background:radial-gradient(circle at 50% 32%,#3A8571,#1A4338);color:#F6DFA2;transform:scale(1.18)}
#markers.far .mk-gwk:not(.sel):not(.inplan) .mk-b{transform:scale(.8);background:radial-gradient(circle at 50% 32%,#30705F,#14352E)}
#markers.far .mk-gwk:not(.sel):not(.inplan) .mk-b svg{opacity:1}
.mk-gwk.inplan .mk-3d{display:none}
.ptag3d{padding:0 4px;border-radius:4px;background:rgba(216,176,102,.18);color:var(--gold);font-size:10.5px;font-weight:800;letter-spacing:.03em}
.d-3d{display:flex;align-items:center;gap:12px;width:100%;margin:14px 0 0;padding:12px 14px;border-radius:14px;text-align:left;background:linear-gradient(120deg,rgba(48,112,95,.42),rgba(216,176,102,.12));border:1px solid rgba(216,176,102,.45);transition:border-color .15s,filter .15s}
.d-3d:hover{border-color:rgba(216,176,102,.85);filter:brightness(1.08)}
.d-3d .gi{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:#14352E;color:#F1D58F;box-shadow:inset 0 0 0 1.5px var(--gold)}
.d-3d .gi svg.i{width:24px;height:24px;stroke-width:1.6}
.d-3d b{display:block;font-size:14px;font-weight:700}
.d-3d small{display:block;margin-top:1px;font-size:12px;color:var(--muted)}
.d-3d>svg.i{margin-left:auto;color:var(--gold)}

/* ---------- GWK: tampilan 3D layar penuh (viewer Sketchfab) ---------- */
#gwk{position:fixed;inset:0;z-index:40;background:var(--gk-bg,#0B1512);opacity:0;transition:opacity .45s,background-color .8s}
#gwk[hidden]{display:none}
#gwk.on{opacity:1}
#gwk .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(14,28,23,.9)}
.gk-stage{position:absolute;left:0;top:calc(76px + env(safe-area-inset-top));right:372px;bottom:0;opacity:0;transform:scale(.98);transition:opacity .6s,transform .8s cubic-bezier(.2,.7,.2,1)}
#gwk.on .gk-stage{opacity:1;transform:none}
#gk-frame{display:block;width:100%;height:100%;border:0}
.gk-load{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);min-width:220px;padding:9px 14px 10px;border-radius:12px;background:rgba(10,20,17,.8);color:#E3DBC9;font-size:12.5px;font-weight:600;text-align:center;pointer-events:none;opacity:0;transition:opacity .3s}
.gk-load.show{opacity:1}
.gk-load i{display:block;height:3px;margin-top:7px;border-radius:2px;background:linear-gradient(90deg,var(--gold) var(--p,0%),rgba(233,224,204,.15) var(--p,0%))}
.gk-top{position:absolute;z-index:3;top:calc(16px + env(safe-area-inset-top));left:16px;right:16px;display:flex;align-items:flex-start;gap:12px;pointer-events:none}
.gk-top>*{pointer-events:auto}
.gk-title{display:flex;align-items:center;gap:12px;padding:9px 16px 9px 9px;border-radius:16px;min-width:0}
.gk-badge{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;background:#14352E;color:#F1D58F;box-shadow:inset 0 0 0 1.5px var(--gold);font-weight:800;font-size:13px;letter-spacing:.02em}
.gk-title h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.gk-title p{margin:1px 0 0;font-size:12.5px;color:var(--muted)}
.gk-modes{position:absolute;left:calc((100% - 340px)/2);transform:translateX(-50%);display:flex;gap:2px;padding:4px;border-radius:14px}
.gk-mode{height:34px;padding:0 15px;border-radius:10px;font-weight:600;font-size:13px;color:var(--muted);transition:background .15s,color .15s}
.gk-mode:hover{color:var(--text)}
.gk-mode[aria-pressed=true]{background:var(--text);color:#13221C}
.gk-vol{margin-left:auto;width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;transition:background .15s}
.gk-vol:hover{background:rgba(30,56,46,.92)}
.gk-vol[aria-pressed=true]{color:var(--muted)}
.gk-cap,.tr-cap{margin-top:12px;font-size:12.5px;color:var(--muted)}
.gk-cap summary,.tr-cap summary{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-weight:600;list-style:none}
.gk-cap summary::-webkit-details-marker,.tr-cap summary::-webkit-details-marker{display:none}
.gk-cap summary::before,.tr-cap summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
.gk-cap[open] summary::before,.tr-cap[open] summary::before{transform:rotate(45deg)}
.gk-cap p,.tr-cap p{margin:8px 0 0;line-height:1.55;color:#CFC7B5}
.gk-close{height:44px;padding:0 16px 0 12px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13px;transition:background .15s}
.gk-close:hover{background:rgba(30,56,46,.92)}
.gk-side{position:absolute;z-index:2;right:16px;top:calc(76px + env(safe-area-inset-top));width:340px;max-height:calc(100% - 92px - env(safe-area-inset-top) - env(safe-area-inset-bottom));border-radius:20px;overflow:auto;padding:18px 20px 20px;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(233,224,204,.18) transparent}
.gk-chap{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.gk-chap .gk-dots{margin:0}
.gk-chap span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.gk-h{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.gk-text{margin:8px 0 0;font-size:13.5px;line-height:1.6;color:#D6CEBC}
.gk-facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin:16px 0 0;padding:14px;border-radius:14px;background:rgba(233,224,204,.045)}
.gk-facts div{margin:0;min-width:0}
.gk-facts dt{font-size:12px;color:var(--faint)}
.gk-facts dd{margin:1px 0 0;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.gk-facts dd.s{margin:0;font-weight:500;font-size:12px;line-height:1.35;color:var(--muted)}
.gk-sec{margin:18px 0 6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.gk-list{list-style:none;margin:0 -8px;padding:0}
.gk-list button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:10px;text-align:left;font-size:13.5px;font-weight:600;transition:background .12s}
.gk-list button:hover{background:rgba(233,224,204,.06)}
.gk-num{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold)}
.gk-foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.gk-link{display:inline-flex;align-items:center;gap:7px;color:var(--gold);font-weight:600;font-size:13px}
.gk-link:hover{text-decoration:underline}
.gk-link svg.i{width:16px;height:16px}
.gk-note{margin:10px 0 0;font-size:12px;line-height:1.5;color:var(--faint)}
.gk-note a{color:var(--muted)}
.gk-back{display:inline-flex;align-items:center;gap:6px;margin-bottom:12px;color:var(--muted);font-weight:600;font-size:12.5px}
.gk-back:hover{color:var(--text)}
.gk-back svg.i{width:15px;height:15px}
.gk-hcard{display:flex;align-items:center;gap:10px}
.gk-hcard .gk-num{width:30px;height:30px;font-size:14px;background:var(--gold);color:#1A140A;box-shadow:none}
.gk-hcard h3{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.gk-nav{display:flex;gap:8px;margin-top:18px}
.gk-nav .btn{flex:1;padding:0 12px}
.gk-nav .btn:disabled{opacity:.35;cursor:default}
.gk-dots{display:flex;gap:6px;margin:6px 0 14px}
.gk-dots button{width:24px;height:5px;border-radius:3px;background:rgba(233,224,204,.18);transition:background .2s}
.gk-dots button[aria-current=true]{background:var(--gold)}
.gk-scale{display:block;width:100%;height:auto;margin:14px 0 0}
.gk-bars{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.gk-bars .t{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.gk-bars .t b{font-weight:600}
.gk-bars .t span{font-weight:700;font-variant-numeric:tabular-nums}
.gk-bars .bar{height:8px;border-radius:4px;margin-top:5px;overflow:hidden;background:rgba(233,224,204,.08)}
.gk-bars i{display:block;height:100%;border-radius:4px;background:rgba(236,228,210,.55)}
.gk-bars .me i{background:linear-gradient(90deg,#3E8A79,var(--gold))}
.gk-bars .me .t b{color:var(--gold)}
.gk-bars small{display:block;margin-top:3px;font-size:12px;color:var(--faint)}
.gk-moods{position:absolute;z-index:2;left:16px;top:calc(88px + env(safe-area-inset-top));display:flex;gap:2px;padding:4px;border-radius:14px}
.gk-mood{height:36px;padding:0 12px 0 10px;border-radius:10px;display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13px;color:var(--muted);transition:background .15s,color .15s}
.gk-mood:hover{color:var(--text)}
.gk-mood svg.i{width:17px;height:17px}
.gk-mood[aria-pressed=true]{background:rgba(216,176,102,.18);color:var(--gold)}
@media (max-width:899px){
  .gk-top{top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;flex-wrap:wrap;gap:8px}
  .gk-title{flex:1;padding:7px 12px 7px 7px}
  .gk-badge{width:32px;height:32px;font-size:12px}
  .gk-title h2{font-size:15px}
  .gk-title p{font-size:12px}
  .gk-modes{position:static;transform:none;order:3;width:100%}
  .gk-mode{flex:1}
  .gk-close{margin-left:0;height:48px;width:48px;padding:0;justify-content:center}
  .gk-close span{display:none}
  .gk-stage{right:0;top:calc(118px + env(safe-area-inset-top));bottom:44vh}
  .gk-load{bottom:12px}
  .gk-side{left:0;right:0;bottom:0;top:auto;width:auto;height:44vh;max-height:none;border-radius:22px 22px 0 0;border-bottom:0;padding:16px 18px calc(18px + env(safe-area-inset-bottom))}
  .gk-moods{left:auto;right:10px;top:calc(126px + env(safe-area-inset-top));flex-direction:column}
  .gk-mood{width:40px;padding:0;justify-content:center}
  .gk-mood span{display:none}
}

/* =================== MOBILE =================== */
@media (max-width:899px){
  :root{--pf-h:60px}
  #brandM{display:flex;position:absolute;z-index:4;left:12px;top:calc(12px + env(safe-area-inset-top));height:42px;padding:0 14px;border-radius:14px;align-items:baseline;gap:7px;padding-top:10px}
  #brandM b{font-size:16px;font-weight:800;letter-spacing:-.02em}
  #brandM span{font-size:12.5px;color:var(--muted)}
  #panel{top:auto;left:0;right:0;bottom:0;width:auto;height:calc(var(--sheet-h) + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;border-bottom:0;transition:height .3s cubic-bezier(.3,.7,.2,1);padding-bottom:env(safe-area-inset-bottom)}
  #panel.expanded{--sheet-h:78vh}
  .handle{display:block;width:100%;height:22px;flex:none;position:relative;touch-action:none}
  .handle::before{content:"";position:absolute;left:50%;top:9px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:rgba(233,224,204,.28)}
  .p-head{padding:0 16px 10px}
  .brand{display:none}
  .search{margin-top:0}
  .handle{order:-2}
  .tabs{padding:0 6px;order:-1}
  .tab{font-size:13px;padding:10px 2px 9px}
  .pane{padding:14px 16px 24px}
  .cathead{--px:16px;--pt:14px}
  #kecbar{left:8px;right:8px;bottom:calc(var(--sheet-h) + env(safe-area-inset-bottom) + 8px);padding:6px;border-radius:16px;gap:6px;transition:bottom .3s cubic-bezier(.3,.7,.2,1),opacity .2s,transform .45s cubic-bezier(.3,.7,.2,1)}
  #panel.expanded~#kecbar,body.detail-open #kecbar,body.tour-on #kecbar{opacity:0;pointer-events:none}
  .kb-tour{padding:0 12px 0 10px;font-size:12.5px}
  .kb-list{display:flex;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
  .kb-list::-webkit-scrollbar{display:none}
  .kb{flex:none;scroll-snap-align:start;padding:0 12px 0 6px}
  .kb svg.kmo{width:26px;height:26px}
  .kb small{display:none}
  .kb b{white-space:nowrap}
  #kecpop{left:8px!important;right:8px;width:auto;margin-left:0;bottom:calc(var(--sheet-h) + var(--pf-h) + 22px + env(safe-area-inset-bottom))}
  #kecinfo{top:auto;left:0;right:0;bottom:0;width:auto;max-height:80vh;border-radius:22px 22px 0 0;border-bottom:0;z-index:8;padding-bottom:env(safe-area-inset-bottom)}
  .ki-hero{height:118px}
  .ki-name h2{font-size:24px}
  .wl-main{padding:24px 18px 40px}
  .wl-h1{font-size:clamp(24px,min(7.4vw,5vh),40px)}
  .wl-script{font-size:clamp(28px,min(8vw,6vh),44px)}
  .wl-opts{margin-top:22px}
  .wl-opt{padding:14px}
  #mapctl{top:calc(12px + env(safe-area-inset-top));right:12px;gap:6px}
  #zin,#zout{display:none}
  .mbtn{width:42px;height:42px}
  #detail{top:auto;left:0;right:0;bottom:0;width:auto;max-height:82vh;border-radius:22px 22px 0 0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom);z-index:7}
  .d-hero{height:118px}
  #tour{top:auto;left:0;right:0;bottom:0;width:auto;max-height:58vh;border-radius:22px 22px 0 0;border-bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));z-index:7}
  .tr-img{height:118px}
  .tr-title{font-size:19px}
  #toast{bottom:calc(var(--sheet-h) + var(--pf-h) + 28px)}
}
@media (max-width:559px){
  .wl-opts{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div id="app">
  <canvas id="scene" aria-label="Peta 3D Kabupaten Badung. Seret untuk memutar, gulir atau cubit untuk memperbesar." role="img"></canvas>
  <div class="fallback" id="fallback" hidden></div>
  <div id="overlay" aria-hidden="true"></div>
  <div id="markers"></div>

  <div id="brandM" class="glass"><b>Terra Explorer</b><span>Badung</span></div>

  <aside id="panel" class="glass" aria-label="Jelajah Badung">
    <button class="handle" id="handle" aria-label="Perbesar panel" aria-expanded="false"></button>
    <div class="p-head">
      <h1 class="brand"><b>Terra Explorer</b><span>Badung, Bali</span></h1>
      <div class="search">
        <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
        <label class="sr" for="q">Cari tempat</label>
        <input id="q" type="search" placeholder="Cari pantai, pura, air terjun…" autocomplete="off">
        <button class="clear" id="qclear" aria-label="Hapus pencarian" hidden><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-jelajah" aria-controls="p-jelajah" aria-selected="true">Jelajah</button>
      <button class="tab" role="tab" id="t-koleksi" aria-controls="p-koleksi" aria-selected="false" tabindex="-1"><svg class="i star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z"/></svg>Rekomendasi</button>
      <button class="tab" role="tab" id="t-rencana" aria-controls="p-rencana" aria-selected="false" tabindex="-1">Rencana <span class="badge" id="planBadge" hidden>0</span></button>
    </div>
    <div class="pane" role="tabpanel" id="p-jelajah" aria-labelledby="t-jelajah"></div>
    <div class="pane" role="tabpanel" id="p-koleksi" aria-labelledby="t-koleksi" hidden></div>
    <div class="pane" role="tabpanel" id="p-rencana" aria-labelledby="t-rencana" hidden></div>
  </aside>

  <!-- bar bawah: pandu tour + 6 kecamatan; kartu pratinjau muncul di atasnya -->
  <section id="kecbar" class="glass" aria-label="Kecamatan di Badung">
    <button class="kb-tour" id="tourbtn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg><span>Pandu tour</span></button>
    <div class="kb-list" id="kblist" role="group" aria-label="Pilih kecamatan"></div>
  </section>
  <div id="kecpop" class="glass" hidden></div>
  <section id="kecinfo" class="glass" aria-labelledby="ki-title" hidden></section>

  <!-- layar sambutan: tombol play memutar salam narator, lalu pilih pandu virtual tour atau explore sendiri -->
  <div id="welcome" role="dialog" aria-modal="true" aria-labelledby="wl-title">
    <!-- video/Video-Desktop.webm diputar tanpa suara (muted) dan berulang; diputar lewat skrip.
         image/panorama.jpg = poster, salinan terkompres dari image/panorama.png -->
    <video class="wl-bg" src="video/Video-Desktop.webm" poster="image/panorama.jpg" muted loop playsinline preload="none"
      disablepictureinpicture disableremoteplayback aria-hidden="true" tabindex="-1"></video>
    <div class="wl-shade"></div>
    <div class="wl-main">
      <img class="wl-logo" src="image/Lambang_Kabupaten_Badung.png" alt="Lambang Kabupaten Badung">
      <h1 class="wl-h1" id="wl-title">Selamat Datang</h1>
      <p class="wl-script">di Kabupaten Badung</p>
      <button class="wl-play" id="wl-play" aria-label="Mulai dan dengarkan salam pembuka">
        <span class="wl-ring"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg></span>
        <b>Mulai</b>
      </button>
      <div class="wl-opts">
        <button class="wl-opt primary" data-wl="tour">
          <span class="wl-ico"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><path d="M4 15a2 2 0 0 1 2-2h1v7H6a2 2 0 0 1-2-2zM20 15a2 2 0 0 0-2-2h-1v7h1a2 2 0 0 0 2-2z"/></svg></span>
          <b>Pandu virtual tour</b>
          <span>Duduk santai. Narator memandumu dari tebing selatan sampai pegunungan utara, lengkap dengan cerita dan suara.</span>
          <em>± 6 menit · dengan narator</em>
        </button>
        <button class="wl-opt" data-wl="explore">
          <span class="wl-ico"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4.5L3.5 6.5v13l5.5-2 6 2 5.5-2v-13l-5.5 2-6-2z"/><path d="M9 4.5v13M15 6.5v13"/></svg></span>
          <b>Explore sendiri</b>
          <span>Pilih kecamatan di bar bawah, lalu jelajahi tempat-tempatnya sesukamu.</span>
          <em class="wl-n">6 kecamatan · 46 tempat</em>
        </button>
      </div>
    </div>
  </div>

window.NARASI = {
  "welcome": "Om Swastiastu! Selamat datang di Kabupaten Badung, Bali. Dari tebing karang Uluwatu di selatan sampai pegunungan sejuk Petang di utara, semuanya bisa kamu jelajahi dari sini. Mau ditemani narator dalam tur virtual, atau menjelajah sendiri? Silakan pilih.",
  "tour-intro":"Halo, selamat datang di Terra Explorer! Yuk, kita telusuri Badung bersama, dari tebing kapur di ujung selatan sampai pegunungan sejuk di utara. Ada enam belas tempat pilihan yang akan kita singgahi. Santai saja, kamu bisa jeda kapan pun kamu mau. Siap? Kita mulai dari selatan.",
  "tour-kec-0": "Bab pertama, Kuta Selatan. Inilah Semenanjung Bukit, daratan kapur dengan tebing-tebing tinggi, pantai tersembunyi, dan kawasan resor Nusa Dua. Ada lima tempat yang menunggu kita di sini.",
  "tour-pandawa": "Kita singgah pertama di Pantai Pandawa. Lihat tebing kapurnya? Di sana berdiri lima patung besar Pandawa Lima, tokoh dari kisah Mahabharata. Jalan menuju pantainya membelah tebing yang tinggi, dan di bawahnya ada teluk yang tenang.",

  "tour-padangpadang": "Tak jauh dari situ ada Pantai Padang Padang. Ombaknya terkenal di kalangan peselancar dari berbagai negara. Pantainya diapit tebing sempit, jadi kita perlu menuruni jalur di celah karang untuk sampai ke pasirnya.",
  "tour-gwk": "Nah, ini dia ikon Bali, Garuda Wisnu Kencana. Patung Dewa Wisnu yang menunggangi Garuda ini tingginya seratus dua puluh satu meter, termasuk pedestalnya. Mau lihat lebih dekat? Ketuk tombol lihat patung tiga dimensi, dan kita masuk ke tur virtualnya.",
  "tour-tanjungbenoa": "Bergeser ke timur, kita sampai di Tanjung Benoa. Semenanjung ini jadi surganya olahraga air, dari parasailing sampai jet ski. Dari dermaganya, perahu juga bisa mengantarmu ke Pulau Penyu.",
  "tour-kec-1": "Bab kedua, Kuta. Inilah pesisir paling ramai di Badung, dengan pantai berpasir panjang dan pusat wisata tertua di Bali. Ada tiga tempat yang akan kita kunjungi.",
  "tour-kuta": "Selamat datang di Pantai Kuta! Sejak era tujuh puluhan, para peselancar sudah berdatangan ke sini. Pasirnya panjang, ombaknya bersahabat untuk pemula, dan senjanya selalu jadi tontonan favorit.",
  "tour-mtk": "Di Jalan Legian, kita berhenti sejenak dalam diam di Monumen Tragedi Kemanusiaan. Monumen ini dibangun untuk mengenang para korban Bom Bali tahun dua ribu dua dari berbagai negara. Nama-nama mereka terukir di dinding, sebagai pengingat akan pentingnya perdamaian.",
  "tour-seminyak": "Lanjut ke Seminyak. Dulu kawasan ini dikelilingi sawah dan kebun, kini dikenal dengan butik, galeri, dan beach club. Pantainya terkenal dengan matahari terbenam dan deretan kursi santai di tepi pasir.",
  "tour-kec-2": "Bab ketiga, Kuta Utara. Garis pantainya membentang dari Petitenget sampai Canggu, dengan ombak untuk berselancar, sawah, dan kedai kopi yang hangat. Dua tempat menanti kita.",
  "tour-petitenget": "Ini Pantai Petitenget. Di tepinya berdiri Pura Petitenget, tempat sembahyang yang penting bagi warga sekitar. Di sekelilingnya kini tumbuh kafe dan butik, berpadu dengan suasana pesisir yang santai.",
  "tour-canggu": "Kita lanjut ke Canggu. Dulunya desa agraris dengan sawah hijau, kini Canggu dikenal sebagai surga peselancar dan pencinta kafe. Di antara sawahnya, kamu masih bisa menemukan pura-pura kecil yang tenang.",
  "tour-kec-3": "Bab keempat, Mengwi. Di pesisirnya ada pantai pasir hitam yang tenang, sementara di pedalaman berdiri pura bersejarah dan desa adat. Kita akan singgah di dua tempat.",
  "tour-seseh": "Pertama, Pantai Seseh. Pasirnya hitam, suasananya tenang, dan jarang ramai. Di sini kamu sering melihat perahu nelayan kecil bersandar di tepi laut. Tempat yang pas untuk menepi dari keramaian.",
  "tour-tamanayun": "Lalu kita ke Pura Taman Ayun, pura kerajaan Mengwi yang dibangun pada abad ketujuh belas. Pura ini termasuk warisan dunia UNESCO bersama sistem subak, dengan kolam dan taman yang mengelilingi bangunan utamanya. Cantik sekali, bukan?",
  "tour-kec-4": "Bab kelima, Abiansemal. Kita mulai naik ke dataran tengah yang lebih sejuk, dengan hutan pala, pancoran suci, dan desa-desa yang asri. Dua tempat menanti.",

  "tour-kec-5": "Bab terakhir, Petang. Inilah dataran tinggi Badung yang sejuk, dengan air terjun, kebun, lembah sungai, dan puncak gunung. Tarik napas dalam-dalam, udaranya segar!",
  "tour-bangkung": "Kita berdiri di Jembatan Tukad Bangkung. Dari sini terlihat lembah yang dalam, aliran sungai di bawah, dan tebing hijau di kiri dan kanan. Pemandangan yang bikin kita betah berlama-lama.",
  "tour-nungnung": "Dan persinggahan terakhir kita, Air Terjun Nungnung. Air terjun ini ada di dasar lembah, dan untuk sampai ke sana kita perlu menuruni ratusan anak tangga. Begitu tiba, gemuruh air dan udara sejuknya akan membayar semua lelah.",
  "tour-end": "Dan sampailah kita di ujung perjalanan. Dari tebing Uluwatu sampai lembah Petang, kamu sudah menyusuri enam belas tempat di Badung. Terima kasih sudah ikut berkeliling! Sekarang giliranmu menjelajah sendiri. Pilih tempat favoritmu di peta, dan sampai jumpa di petualangan berikutnya.",
  "gwk-intro": "Selamat datang di Garuda Wisnu Kencana! Di depanmu ada Dewa Wisnu yang menunggangi Garuda, karya pematung I Nyoman Nuarta. Putar modelnya sesukamu, lalu ketuk titik bernomor untuk mendengar kisah tiap bagiannya. Atau pilih mode Kisah, dan biarkan aku bercerita.",
  "gwk-mahkota": "Lihat wajah Wisnu yang tenang ini. Dalam ajaran Hindu, Wisnu adalah dewa pemelihara alam semesta. Mahkotanya bertingkat khas Bali, dan bersama kalungnya yang lebar, warnanya keemasan, kontras dengan tubuh patung yang hijau toska.",
  "gwk-tangan": "Perhatikan tangannya. Pada model ini, satu tangan Wisnu terangkat di depan dada, sementara tangan lainnya memegang benda berbentuk cakram yang menyerupai cakra, senjata khas Wisnu.",
  "gwk-garuda": "Ini dia Garuda, wahana atau kendaraan setia Wisnu. Kepalanya bermahkota, paruhnya bengkok, dan matanya melotot. Gagah sekaligus setia. Tahukah kamu, Garuda juga menjadi lambang negara kita, Indonesia.",
  "gwk-sayap": "Sekarang bayangkan bentang sayapnya: sekitar enam puluh empat sampai enam puluh enam meter, hampir selebar lapangan sepak bola. Bulu-bulunya melengkung seperti nyala api, mengingatkan pada ukiran khas Bali.",
  "gwk-kipas": "Di belakang Wisnu, deretan bulu mengembang tinggi dan membingkai sosoknya seperti lingkaran cahaya. Bagian inilah yang menjadi puncak patung.",
  "gwk-modul": "Patung raksasa ini tidak dibuat dalam satu bongkahan. Kulitnya tersusun dari lempengan tembaga dan kuningan yang dipasang pada rangka baja. Sejumlah sumber menyebut ada tujuh ratus lima puluh empat modul, dengan berat total sekitar tiga sampai empat ribu ton.",
  "gwk-pedestal": "Model ini hanya menampilkan patungnya. Aslinya, patung ini berdiri di atas bangunan pedestal setinggi sekitar empat puluh enam meter, sehingga tinggi totalnya seratus dua puluh satu meter, kira-kira setara gedung empat puluh lantai.",
  "gwk-kisah-1": "Dahulu kala, dalam kisah Adiparwa, dua saudari bernama Winata dan Kadru bertaruh tentang warna ekor kuda Uccaihsrawa. Kadru berbuat curang dengan bantuan anak-anaknya, para naga. Winata pun kalah, dan harus menjadi budak Kadru.",
  "gwk-kisah-2": "Garuda, putra Winata, tidak tega melihat ibunya menderita. Para naga berjanji akan membebaskan Winata, asalkan Garuda membawakan tirta amerta, air keabadian yang dijaga para dewa.",
  "gwk-kisah-3": "Maka terbanglah Garuda ke kahyangan. Ia mengalahkan para penjaga dan berhasil membawa amerta. Tapi lihat ketulusannya: setetes pun tidak ia minum untuk dirinya sendiri.",
  "gwk-kisah-4": "Wisnu terkesan pada ketulusan itu. Ia menganugerahi Garuda keabadian, dan Garuda bersedia menjadi wahana, kendaraan setia Wisnu. Momen inilah yang diabadikan dalam patung ini.",
  "gwk-kisah-5": "Kisah tentang kesetiaan dan pengabdian ini diwujudkan I Nyoman Nuarta menjadi patung setinggi seratus dua puluh satu meter. Batu pertamanya diletakkan pada tahun seribu sembilan ratus sembilan puluh tujuh, sempat terhenti saat krisis ekonomi, lalu diresmikan pada dua puluh dua September dua ribu delapan belas. Terima kasih sudah mendengarkan!",
  "gwk-skala": "Seberapa tinggi seratus dua puluh satu meter itu? Dengan pedestalnya, Garuda Wisnu Kencana hampir setinggi Monas di Jakarta, dan jauh lebih tinggi dari Patung Liberty di New York. Dibandingkan orang dewasa, patung ini kira-kira tujuh puluh kali lebih tinggi."

<!-- =========================================================
     NARATOR
     Memutar audio/narasi/<kunci>.mp3 (naskah di window.NARASI),
     satu klip pada satu waktu. Dipakai cerita Telusuri dan GWK.
     Pilihan suara on/off diingat di browser pengunjung.
     ========================================================= -->
<script>
window.NARATOR = (function(){
'use strict';
const STORE = 'terra-badung-narator', BASE = 'audio/narasi/';
/* klip diputar sedikit lebih lambat agar tidak terdengar terburu-buru; nada suara tetap */
const RATE = 0.9;
let muted = false;
try { muted = localStorage.getItem(STORE) === 'off'; } catch (e) {}
const el = new Audio(); el.preload = 'auto';
el.preservesPitch = el.mozPreservesPitch = el.webkitPreservesPitch = true;
el.defaultPlaybackRate = el.playbackRate = RATE;
let key = null, onEnd = null, fadeIn = 0, fadeT = 0, intro = null, introT = 0;
const subs = [], stateSubs = [];
const emit = ev => stateSubs.forEach(fn => fn(ev));
const finish = failed => { const f = onEnd; onEnd = null; if (f) f(!!failed); };
el.addEventListener('ended', () => { finish(false); emit('ended'); });
el.addEventListener('error', () => { if (key) finish(true); emit('error'); });
el.addEventListener('playing', () => {
  /* fade in dihitung sejak suara benar-benar mulai, bukan sejak play() dipanggil */
  if (fadeIn) {
    const t0 = performance.now(), dur = fadeIn*1000;
    fadeIn = 0; clearInterval(fadeT);
    fadeT = setInterval(() => { const v = Math.min(1, (performance.now() - t0)/dur); el.volume = v; if (v >= 1) { clearInterval(fadeT); fadeT = 0; } }, 30);
  }
  /* bagian awal diputar lebih lambat, lalu kembali ke RATE di jeda setelahnya */
  if (intro && !introT) {
    el.playbackRate = el.currentTime < intro.until ? intro.rate : RATE;
    introT = setInterval(() => { if (el.currentTime >= intro.until) { el.playbackRate = RATE; intro = null; clearInterval(introT); introT = 0; } }, 20);
  }
  emit('playing');
});
el.addEventListener('pause', () => emit('pause'));
/* putar klip; done(failed) dipanggil saat selesai. opt.fade = lama fade in (detik);
   opt.intro = {until, rate}: sampai detik ke-until klip diputar dengan kecepatan rate.
   Mengembalikan false bila tidak diputar. */
function play(k, done, opt){
  stop();
  if (muted || !window.NARASI || !window.NARASI[k]) return false;
  key = k; onEnd = done || null;
  fadeIn = opt && opt.fade || 0;
  intro = opt && opt.intro || null;
  el.volume = fadeIn ? 0 : 1;
  el.src = BASE + k + '.mp3';   /* sumber baru selalu mulai dari awal; jangan seek di sini */
  el.playbackRate = intro ? intro.rate : RATE;
  const p = el.play();
  /* browser bisa menahan suara (belum ada interaksi pengguna): kabari tampilan */
  if (p && p.catch) p.catch(err => { if (key === k) { key = null; finish(true); if (err && err.name === 'NotAllowedError') emit('blocked'); } });
  return true;
}
function stop(){ onEnd = null; key = null; fadeIn = 0; clearInterval(fadeT); fadeT = 0; intro = null; clearInterval(introT); introT = 0; el.volume = 1; try { el.pause(); } catch (e) {} }
function setMuted(m){
  muted = m;
  try { localStorage.setItem(STORE, m ? 'off' : 'on'); } catch (e) {}
  if (m && key) { const f = onEnd; stop(); if (f) f(true); }
  subs.forEach(fn => fn(m));
}
return {
  play, stop, setMuted,
  pause(){ if (key) el.pause(); },
  resume(){ if (key) { const p = el.play(); if (p && p.catch) p.catch(() => {}); } },
  progress(){ return key && el.duration ? el.currentTime/el.duration : null; },
  current(){ return key; },
  isMuted(){ return muted; },
  isTalking(){ return !!key && !el.paused; },
  onMute(fn){ subs.push(fn); },
  onState(fn){ stateSubs.push(fn); }
};
})();
</script>

<!-- =========================================================
     MUSIK LATAR
     audio/background-bali.mp3 diputar berulang (loop) mulai dari
     salam pembuka di layar sambutan. Mode 'welcome' (salam) dan
     'tour' (Pandu virtual tour) pelan supaya narator jelas; mode
     'explore' (Explore sendiri) sedikit lebih keras. Musik selalu masuk dengan fade in: saat mulai,
     di awal setiap putaran, dan setelah narator selesai bicara.
     Volume diatur langsung di elemen audio. iOS mengunci volume
     elemen audio, jadi di sana dipakai Web Audio (GainNode). Web Audio
     tidak dipakai di tempat lain karena membisukan berkas yang dibuka
     langsung dari disk (file://). Pilihan on/off diingat browser.
     ========================================================= -->
<script>
window.MUSIK = (function(){
'use strict';
const STORE = 'terra-badung-musik', SRC = 'audio/background-bali.mp3';
/* rekaman musiknya keras (RMS ± 0,35) dibanding narator (± 0,11), jadi volumenya diturunkan.
   DUCK = volume selagi narator bicara: musik ± 7–8 dB di bawah narator, tetap terdengar. */
const LEVEL = {welcome:0.22, tour:0.22, explore:0.32}, DUCK = {welcome:0.13, tour:0.13, explore:0.14};
const FADE_IN = 4, FADE_OUT = 3;   /* detik di awal dan akhir setiap putaran */
let on = true;
try { on = localStorage.getItem(STORE) !== 'off'; } catch (e) {}
const el = new Audio(); el.loop = true; el.preload = 'none'; el.volume = 0;
const viaGain = el.volume !== 0;   /* volume terkunci (iOS) */
let mode = null, ctx = null, gain = null, vol = 0, tc = 1.2, last = 0, timer = 0;
const subs = [];
function target(){
  if (!on || !mode || document.hidden) return 0;
  return (window.NARATOR && NARATOR.isTalking() ? DUCK : LEVEL)[mode];
}
/* 20× per detik: volume mendekati target dengan konstanta waktu tc, dikali amplop
   putaran (naik selama FADE_IN di awal, turun selama FADE_OUT di akhir) */
function tick(){
  const now = performance.now(), dt = Math.min(1, (now - last)/1000), tg = target();
  last = now;
  vol += (tg - vol)*(1 - Math.exp(-dt/tc));
  const d = el.duration, t = el.currentTime;
  const v = d && isFinite(d) ? vol*Math.max(0, Math.min(1, t/FADE_IN, (d - t)/FADE_OUT)) : 0;
  if (gain) gain.gain.setTargetAtTime(v, ctx.currentTime, 0.03); else el.volume = Math.min(1, v);
  if (tg === 0 && vol < 0.002) { vol = 0; el.pause(); clearInterval(timer); timer = 0; }
}
function apply(t){
  tc = t;
  if (target() > 0) {
    if (viaGain && !ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) { ctx = new AC(); gain = ctx.createGain(); gain.gain.value = 0; ctx.createMediaElementSource(el).connect(gain).connect(ctx.destination); }
    }
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (el.paused) { if (!el.src) el.src = SRC; const p = el.play(); if (p && p.catch) p.catch(() => {}); }
  }
  if (!timer && (target() > 0 || vol > 0)) { last = performance.now(); timer = setInterval(tick, 50); }
}
/* panggil dari klik pengguna: browser hanya mengizinkan suara setelah ada interaksi */
function setMode(m){
  if (m === mode) return;
  const first = !mode; mode = m;
  apply(first ? 1.2 : 0.8);
}
function setOn(v){
  on = v;
  try { localStorage.setItem(STORE, v ? 'on' : 'off'); } catch (e) {}
  apply(v ? 1.2 : 0.3);
  subs.forEach(fn => fn(v));
}
if (window.NARATOR) NARATOR.onState(() => apply(NARATOR.isTalking() ? 0.25 : 0.9));
document.addEventListener('visibilitychange', () => apply(document.hidden ? 0.2 : 1.2));
return {
  mode: setMode, setOn,
  isOn(){ return on; },
  onChange(fn){ subs.push(fn); }
};
})();
</script>

let rootEl, stageEl, frame, sideEl, loadEl, mq;

let open_ = false, onCloseCb = null, lastFocus = null;
let mode = 'jelajah', hot = null, chapter = 0, moodName = 'siang';

function loadApi(){
  if (window.Sketchfab) return Promise.resolve();
  if (!apiPromise) apiPromise = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = API_SRC; s.async = true; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
  return apiPromise;
}
const call = (fn, ...args) => new Promise(res => {
  if (!api) return res(null);

/* di layar sempit kamera sedikit dimundurkan agar sayap tidak terpotong */
function look(v, dur){
  if (!api) return;
  const r = stageEl.getBoundingClientRect(), k = r.width/Math.max(1, r.height) < 0.9 ? 1.15 : 1;
  const eye = v.eye.map((e, i) => v.target[i] + (e - v.target[i])*k);
  call('setCameraLookAt', eye, v.target, dur == null ? 1.6 : dur);
}
function showHots(on){ HOTS.forEach((_, i) => call(on ? 'showAnnotation' : 'hideAnnotation', i)); }
function setLoad(text, p){
  if (!text) { loadEl.classList.remove('show'); return; }
  loadEl.querySelector('span').textContent = text;
  loadEl.style.setProperty('--p', p == null ? '0%' : (Math.round(p*100) + '%'));
  loadEl.classList.add('show');

function start(){
  status = 'loading';
  setLoad('Memuat model 3D…', 0);
  loadApi().then(() => {
    const client = new window.Sketchfab('1.12.1', frame);
    client.init(UID, Object.assign({}, EMBED_OPTS, {
      success(a){
        api = a; a.start();
        a.addEventListener('modelLoadProgress', e => { if (status === 'loading' && e && e.progress != null) setLoad('Memuat model 3D…', e.progress); });
        a.addEventListener('viewerready', onReady);
      },
      error(){ basic(); }
    }));

}
/* tanpa Viewer API: tampilkan embed biasa, model tetap bisa diputar */
function basic(){
  status = 'basic'; api = null;

async function onReady(){
  status = 'ready';

function applyMood(){
  const m = MOODS[moodName];
  rootEl.style.setProperty('--gk-bg', m.css);
  if (!api) return;
  call('setBackground', {color:m.bg});
  call('setEnvironment', {exposure:m.exposure, lightIntensity:m.intensity, rotation:m.rotation});
  call('setLightFeatureEnabled', !!m.lights);
  if (m.lights) m.lights.forEach((l, i) => call('setLight', i, {color:l.slice(0, 3), intensity:l[3]}));
}
function setMood(name){
  moodName = name;
  rootEl.querySelectorAll('.gk-mood').forEach(b => b.setAttribute('aria-pressed', b.dataset.mood === name));

}

  look(HOME);

}
function showChapter(){
  const c = CHAPTERS[chapter];

}
function selectHot(id){

function say(k){ voiceKey = k; if (window.NARATOR) NARATOR.play(k); }
function hush(){ voiceKey = null; if (window.NARATOR) NARATOR.stop(); }
function caption(){

}
function syncVol(){
  const b = document.getElementById('gk-vol'); if (!b || !window.NARATOR) return;

      ${last ? `<button class="btn btn-primary" data-mode="jelajah">Jelajahi patung${gi('arrow')}</button>` : `<button class="btn btn-primary" data-ch="${chapter + 1}">Lanjut${gi('arrow')}</button>`}</div>
      <p class="gk-note">Diringkas dari kisah Garuda dalam Adiparwa, bagian awal Mahabharata.</p>`;
  } else {
    h = `<h3 class="gk-h">Seberapa tinggi 121 meter?</h3>
      <p class="gk-text">Model di samping hanya patungnya. Dengan pedestal, GWK hampir setinggi Monas dan jauh lebih tinggi dari Patung Liberty.</p>

      <ul class="gk-bars">${COMPARE.map(c => `<li class="${c.me ? 'me' : ''}"><div class="t"><b>${c.name}</b><span>${fmtM(c.h)} m</span></div><div class="bar"><i style="width:${Math.max(1, c.h/132*100).toFixed(1)}%"></i></div><small>${c.note}</small></li>`).join('')}</ul>
      <p class="gk-note">Siluet hanya perkiraan bentuk, digambar dengan skala yang sama.</p>`;
  }
  const a = document.activeElement, refocus = a && sideEl.contains(a);
  const key = refocus && a.dataset ? ['hot', 'ch', 'mode'].find(k => a.dataset[k] !== undefined) : null;
  sideEl.innerHTML = h + caption();
  sideEl.scrollTop = 0;
  if (refocus) {
    const n = (key && sideEl.querySelector(`[data-${key}="${a.dataset[key]}"]:not([disabled])`)) || sideEl.querySelector('.btn-primary, button');
    if (n) n.focus({preventScroll:true});
  }
}

function onKey(e){
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); return; }
  if (e.key === 'Tab') {
    const f = [...rootEl.querySelectorAll('button:not([disabled]), a[href], iframe')].filter(x => x.offsetParent !== null);
    if (!f.length) return;
    const i = f.indexOf(document.activeElement);
    if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && (i === f.length - 1 || i < 0)) { e.preventDefault(); f[0].focus(); }
  }
}
function init(){
  rootEl = document.getElementById('gwk'); stageEl = document.getElementById('gk-stage'); frame = document.getElementById('gk-frame');
